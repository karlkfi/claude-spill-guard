# One sentence per source line in every Markdown file here. A one-sentence edit
# is then a one-line diff, and two branches editing one paragraph stop
# colliding on the rewrap.
#
# max-width stays 0. A width turns on clause-level splitting, which is where
# mdreflow's known render changes live; unbounded sentence mode breaks only at
# the end of a sentence.
mode: sentence
max-width: 0

exclude:
  # GitHub renders these as a comment body, where a newline is a <br>. Each
  # release file is also the published body byte for byte, which the
  # release-notes gate holds.
  - "/docs/releases/v*.md"
  - "/.github/pull_request_template.md"
  # Fixtures. The corpus is read for match counts and byte offsets, and the
  # release-note bodies are inputs to check-release-note.py. A directory takes
  # `/**`: a trailing slash alone does not match a file named on the command
  # line, which is how scripts/check-md-reflow.py names them.
  - "/testdata/corpus/*/**"
  - "/testdata/release-note/**"
