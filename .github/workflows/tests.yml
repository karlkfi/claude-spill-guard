name: tests

on:
  push:
    branches: [main]
  pull_request:
  # For `vulns` and nothing else. An advisory lands against code that has not
  # changed, so a gate that only runs on a diff reports a binary as clean for
  # as long as nobody touches it. Every other job runs too, which costs a few
  # runner-minutes a week and re-exercises the mutation controls -- the ones
  # most likely to rot unobserved, since nothing else makes them fail.
  schedule:
    - cron: '17 4 * * 1'

# Every gate here is paired with a mutation control that breaks the property and
# requires the gate to go red. A gate that has never failed is a claim, not
# evidence, and every one of these has a spelling that passes on a tree with
# nothing in it.
#
# The `precision` and rule `mutation-control` jobs the design calls for land with
# the ruleset -- there is no corpus to run yet.
# See docs/design/README.md, section "CI".

env:
  PYTHON_VERSION: '3.13'

jobs:
  # setup-go on purpose: the required tier names Go, so a runner without it
  # would redden this for a reason that says nothing about the tree.
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: The tools report runs, and the required tier is satisfied
        run: make doctor

  # The row's stated property, and the one it says is easy to lose: this has to
  # run on a fresh clone with none of the tools present. The natural
  # implementation reaches for the very things it is checking -- `go version`
  # to find Go, `go run` from tools/ to find a linter -- and both work on the
  # machine of whoever wrote them.
  #
  # Two mutations, because "absent" has two shapes here: not on PATH, and
  # present but with nothing fetched to run it with.
  doctor-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # This machine minus Go, built rather than hardcoded. `PATH=/usr/bin:/bin`
      # was the obvious spelling and it does not mutate anything: setup-go
      # links go into /usr/bin, so the step ran against a PATH that still had
      # it and reported `go /usr/bin/go`. Measured on this runner 2026-08-22.
      # Naming directories to drop is guesswork about where a tool lives; this
      # names the tool.
      #
      # Four assertions. The first is the one the /usr/bin spelling lacked --
      # that the mutation mutated -- and the last two are what say the output
      # is a report rather than a crash at the first absence.
      - name: With Go off PATH it must still report, and must name Go
        run: |
          # `if` rather than `[ ... ] && continue` -- though not because the
          # && would die here. This step runs under `bash -e`, which exempts
          # the left side of an && list, so the loop below would run to
          # completion at rc=0. What the && costs is that the quiet depends on
          # position: the same list takes a step down as the script's last
          # command, as a called function's last command, or when the command
          # after the final && is the one that fails. `if` is quiet wherever it
          # sits. Measured 2026-08-22 on bash 3.2.57 and 5.3.15.
          shim="$(mktemp -d)"
          IFS=: read -ra dirs <<< "$PATH" || true
          for d in "${dirs[@]}"; do
            if [ ! -d "$d" ]; then continue; fi
            for f in "$d"/*; do
              if [ ! -e "$f" ]; then continue; fi
              b="$(basename "$f")"
              if [ "$b" = go ]; then continue; fi
              if [ ! -e "$shim/$b" ]; then ln -s "$f" "$shim/$b"; fi
            done
          done
          if PATH="$shim" command -v go; then
            echo "::error::the mutation changed nothing -- go is still reachable" >&2
            exit 1
          fi
          env PATH="$shim" make doctor > mutant.log 2>&1 && rc=0 || rc=$?
          echo "doctor exit: $rc"
          cat mutant.log
          rm -rf "$shim"
          if [ "$rc" -eq 0 ]; then
            echo "::error::doctor passed with go missing from the required tier" >&2
            exit 1
          fi
          if ! grep -qE '^  go +MISSING' mutant.log; then
            echo "::error::doctor failed, but did not name go as missing" >&2
            exit 1
          fi
          if ! grep -qE '^  git +/' mutant.log; then
            echo "::error::doctor stopped at the first missing tool instead of reporting the rest" >&2
            exit 1
          fi

      # The other half of a fresh clone: Go is here, and nothing has been
      # fetched. Anything reaching tools/ -- `go run`, `go build`, `go list` --
      # fails with the proxy off over an empty module cache, so this stays
      # green only while the probe is `command -v` and nothing else.
      - name: With no module cache and no proxy it must still exit clean
        run: |
          cache="$(mktemp -d)"
          GOFLAGS=-mod=mod GOPROXY=off GOMODCACHE="$cache"             make doctor > mutant.log 2>&1 && rc=0 || rc=$?
          echo "doctor exit: $rc"
          cat mutant.log
          rm -rf "$cache"
          if [ "$rc" -ne 0 ]; then
            echo "::error::doctor reached for something it had to download -- it must not touch tools/" >&2
            exit 1
          fi

  # First, because it is the gate over the list every other job is on. `GATES`
  # in the Makefile is the source of truth; this asserts the job list here, the
  # table in CLAUDE.md and `make list-gates` still agree with it.
  gate-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Every copy of the gate list still agrees with the Makefile
        run: make gate-drift

  # Five mutations: four for the directions the lists can come apart, and one
  # for the parse itself. A drift check that only catches a missing job says
  # nothing about a stale table, and the stale table is the one that reads as
  # authoritative while being wrong.
  gate-drift-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: A gate the workflow does not run must fail the check
        run: |
          printf '\nGATES += mutant\nmutant.desc := a gate no job runs\nmutant:\n\t@true\n' >> Makefile
          make gate-drift > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- Makefile
          if [ "$rc" -eq 0 ]; then
            echo "::error::gate-drift passed with a gate no CI job runs" >&2
            exit 1
          fi
          if ! grep -q 'has no `mutant` job' mutant.log; then
            echo "::error::gate-drift failed, but not on the missing job" >&2
            exit 1
          fi

      - name: A job in no gate's name must fail the check
        run: |
          printf '\n  mutant-job:\n    runs-on: ubuntu-latest\n    steps:\n      - run: "true"\n' \
            >> .github/workflows/tests.yml
          make gate-drift > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- .github/workflows/tests.yml
          if [ "$rc" -eq 0 ]; then
            echo "::error::gate-drift passed with a job outside the gate list" >&2
            exit 1
          fi
          if ! grep -q 'runs a `mutant-job` job' mutant.log; then
            echo "::error::gate-drift failed, but not on the extra job" >&2
            exit 1
          fi

      # The one that keeps `make check` and CI running the same command. A job
      # calling the script directly passes every other assertion here.
      - name: A gate job that does not invoke its make target must fail the check
        run: |
          sed -i 's|^        run: make docs$|        run: python3 scripts/check-doc-links.py|' \
            .github/workflows/tests.yml
          if git diff --quiet; then
            echo "::error::the mutation changed nothing -- the docs job no longer matches" >&2
            exit 1
          fi
          make gate-drift > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- .github/workflows/tests.yml
          if [ "$rc" -eq 0 ]; then
            echo "::error::gate-drift passed with a job bypassing its make target" >&2
            exit 1
          fi
          if ! grep -q 'does not invoke `make docs`' mutant.log; then
            echo "::error::gate-drift failed, but not on the bypassed target" >&2
            exit 1
          fi

      # The defect this gate shipped with, on 2026-08-22: GNU make 4.x announces
      # `make[1]: Entering directory ...` on stdout when MAKELEVEL says it is a
      # sub-make, which is exactly how this script is reached. The parse read
      # two banners as two gates and reported nine findings, none of them real.
      # make 3.81 never prints it, so no local run could have caught it. The
      # banner is suppressed twice over now; this asserts the third answer,
      # which is that an unparseable line is refused rather than absorbed.
      - name: Noise on print-gates stdout must be refused, not read as a gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Makefile")
          t = p.read_text()
          old = "print-gates:\n\t@$(foreach g,$(GATES),"
          new = ("print-gates:\n"
                 "\t@printf \"make[1]: Entering directory '/home/runner/work/x/x'\\n\"\n"
                 "\t@$(foreach g,$(GATES),")
          assert t.count(old) == 1, "print-gates is not where the mutation expects it"
          p.write_text(t.replace(old, new))
          PY
          make gate-drift > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- Makefile
          if [ "$rc" -eq 0 ]; then
            echo "::error::gate-drift passed with a directory banner on print-gates stdout" >&2
            exit 1
          fi
          if ! grep -q 'wrote a line that is not a gate' mutant.log; then
            echo "::error::gate-drift failed, but not on the unparseable line" >&2
            exit 1
          fi

      - name: A stale generated table must fail the check
        run: |
          sed -i 's#gofmt, go vet and go test#gofmt and go vet#' CLAUDE.md
          if git diff --quiet; then
            echo "::error::the mutation changed nothing -- the table no longer matches" >&2
            exit 1
          fi
          make gate-drift > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- CLAUDE.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::gate-drift passed with a stale gate table in CLAUDE.md" >&2
            exit 1
          fi
          if ! grep -q 'does not match the list' mutant.log; then
            echo "::error::gate-drift failed, but not on the table" >&2
            exit 1
          fi

  # git skips a hook that is not executable, silently and at exit 0, so a hook
  # that lost its mode bit looks exactly like a repo with no hook.
  status-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: The README's status table still says what the tree can do
        run: make status-drift

  # The status table is generated, so the interesting mutation is not editing
  # the block -- it is changing what the tree can do and leaving the block
  # alone. That is the decay this gate exists for, and the only one a reader
  # cannot see happening.
  #
  # The markers are the case neither of those reaches. They are not the table's
  # content and not the tree, but whether there is a block to compare at all,
  # and every other step here assumes the pair is present to be read.
  status-drift-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The row this flips has to be one whose committed value the tree really
      # produces, so the direction follows the tree rather than being fixed:
      # it read `no` until the shipped ruleset existed and reads `yes` now.
      # The precondition below is what makes that maintainable -- a sed that
      # stops matching fails the step instead of passing it.
      - name: A hand-edited status table must fail the check
        run: |
          sed -i 's/| Ship a ruleset | yes |/| Ship a ruleset | no |/' README.md
          if git diff --quiet -- README.md; then
            echo "::error::the mutation changed nothing, so this step tested nothing" >&2
            exit 1
          fi
          make status-drift > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- README.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::status-drift passed on a table that denies a ruleset the tree has" >&2
            exit 1
          fi
          if ! grep -q 'does not match the tree' mutant.log; then
            echo "::error::status-drift failed, but not on the table disagreeing with the tree" >&2
            exit 1
          fi

      # This mutation goes the way the tree does not. It used to add an import
      # and require the row to flip to `yes`; the hook entry made
      # `internal/scan` reachable, and a redundant import of something already
      # in the graph changes nothing -- the table would not move, status-drift
      # would pass, and the step would fail saying the check was too lax.
      #
      # The precondition could not have caught that. It asked whether the
      # binary reaches `internal/scan`, which was true before the mutation and
      # after it, so it asserted the mutation had happened rather than that it
      # had had an effect. Unwiring gives that assertion something to measure.
      - name: Unwiring the scanner must fail the check and flip the table
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("cmd/spill-guard/main.go")
          s = p.read_text(encoding="utf-8")
          s = s.replace('\t"github.com/karlkfi/claude-spill-guard/internal/hook"\n', "")
          s = s.replace('\tcase "hook":\n\t\treturn hook.Run(stdin, stdout, stderr)\n', "")
          s = s.replace("  hook      scan a Claude Code hook payload read from stdin\n", "")
          p.write_text(s, encoding="utf-8")
          PY
          gofmt -w cmd/spill-guard/main.go
          if go list -deps ./cmd/spill-guard | grep -q 'internal/scan'; then
            echo "::error::the binary still reaches internal/scan, so this step tested nothing" >&2
            git checkout -- cmd/spill-guard/main.go
            exit 1
          fi
          make status-drift > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::status-drift passed while the README said the binary can scan and it cannot" >&2
            git checkout -- cmd/spill-guard/main.go
            exit 1
          fi
          # The rewrite must track the code, not merely notice a difference:
          # a generator that always emits the committed text would pass the
          # assertion above and be worth nothing.
          make status > /dev/null 2>&1 || true
          grep -q '| Scan a file or a buffer | no |' README.md && flipped=0 || flipped=1
          git checkout -- cmd/spill-guard/main.go README.md
          if [ "$flipped" -ne 0 ]; then
            echo "::error::the generated table did not flip to no once the binary stopped reaching internal/scan" >&2
            exit 1
          fi

      - name: A command the usage text does not name must fail the check
        run: |
          sed -i 's|^\tcase "version":|\tcase "scan":\n\t\treturn 0\n\tcase "version":|' cmd/spill-guard/main.go
          gofmt -w cmd/spill-guard/main.go
          if ! grep -q 'case "scan":' cmd/spill-guard/main.go; then
            echo "::error::the mutation did not add a case arm, so this step tested nothing" >&2
            exit 1
          fi
          make status-drift > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- cmd/spill-guard/main.go
          if [ "$rc" -eq 0 ]; then
            echo "::error::status-drift passed on a command the usage text does not name" >&2
            exit 1
          fi
          if ! grep -q 'usage text does not name it' mutant.log; then
            echo "::error::status-drift failed, but not on the undocumented command" >&2
            exit 1
          fi

      # Q55. `block()` returns None when either marker is missing; `--check`
      # reports it and the rewrite refuses. Nothing drove either path, so the
      # one branch with no case behind it was the branch deciding whether the
      # gate inspects anything at all.
      #
      # Red is not the assertion, and neither is a non-zero rewrite. The
      # regression to expect is `block()` handing back a tuple instead of None:
      # the empty text then fails the table comparison, so the exit code does
      # not move and only the message does. And a rewrite that dies on
      # `parts[1]` exits non-zero and writes nothing, exactly as the refusal
      # does. So both halves grep for the message they are actually about.
      - name: A README with no marker pair must fail the check and refuse the rewrite
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("README.md")
          keep = [l for l in p.read_text(encoding="utf-8").splitlines(keepends=True)
                  if "status:begin" not in l and "status:end" not in l]
          p.write_text("".join(keep), encoding="utf-8")
          PY
          if grep -q 'status:begin' README.md || grep -q 'status:end' README.md; then
            echo "::error::the mutation changed nothing -- a marker survives, so block() still finds the pair" >&2
            exit 1
          fi
          make status-drift > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::status-drift passed on a README with no status markers" >&2
            git checkout -- README.md
            exit 1
          fi
          if ! grep -q 'README.md has no `status:begin`' mutant.log; then
            echo "::error::status-drift failed, but not on the missing markers" >&2
            git checkout -- README.md
            exit 1
          fi

          before=$(git hash-object README.md)
          make status > mutant.log 2>&1 && rc=0 || rc=$?
          echo "rewrite exit: $rc"
          cat mutant.log
          after=$(git hash-object README.md)
          git checkout -- README.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::make status exited 0 with no block to rewrite" >&2
            exit 1
          fi
          if [ "$before" != "$after" ]; then
            echo "::error::make status wrote to README.md with no block to put one in" >&2
            exit 1
          fi
          if ! grep -q 'there is nothing to rewrite' mutant.log; then
            echo "::error::make status refused, but not on the missing markers -- a traceback refuses the same way" >&2
            exit 1
          fi

  hooks-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Every tracked git hook would run
        run: make hooks-check

  # Four mutations: the mode bit git reads, a name git never calls, a missing
  # shebang, and an empty directory -- which is how every assertion in the gate
  # passes over nothing at all.
  hooks-check-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: A hook that is not executable in the index must fail the gate
        run: |
          git update-index --chmod=-x .githooks/pre-commit
          make hooks-check > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git update-index --chmod=+x .githooks/pre-commit
          if [ "$rc" -eq 0 ]; then
            echo "::error::hooks-check passed with a hook git would skip" >&2
            exit 1
          fi
          if ! grep -q 'is mode 100644 in the index' mutant.log; then
            echo "::error::hooks-check failed, but not on the mode bit" >&2
            exit 1
          fi

      - name: A file under a name git never calls must fail the gate
        run: |
          git mv .githooks/pre-commit .githooks/pre-comit
          make hooks-check > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git mv .githooks/pre-comit .githooks/pre-commit
          if [ "$rc" -eq 0 ]; then
            echo "::error::hooks-check passed with a misspelled hook name" >&2
            exit 1
          fi
          if ! grep -q 'not a hook name git recognises' mutant.log; then
            echo "::error::hooks-check failed, but not on the name" >&2
            exit 1
          fi

      - name: A hook with no shebang must fail the gate
        run: |
          sed -i '1{/^#!/d}' .githooks/pre-commit
          if git diff --quiet; then
            echo "::error::the mutation changed nothing -- the hook has no shebang to strip" >&2
            exit 1
          fi
          make hooks-check > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- .githooks
          if [ "$rc" -eq 0 ]; then
            echo "::error::hooks-check passed with a hook carrying no shebang" >&2
            exit 1
          fi
          if ! grep -q 'opens with no shebang' mutant.log; then
            echo "::error::hooks-check failed, but not on the shebang" >&2
            exit 1
          fi

      - name: An empty hooks directory must fail the gate
        run: |
          git rm -q --cached .githooks/pre-commit
          make hooks-check > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git reset -q HEAD -- .githooks
          if [ "$rc" -eq 0 ]; then
            echo "::error::hooks-check passed over a directory with no hook in it" >&2
            exit 1
          fi
          if ! grep -q 'holds no tracked file' mutant.log; then
            echo "::error::hooks-check failed, but not on the empty directory" >&2
            exit 1
          fi

  # The one job here that is not ubuntu-only, and the row that asked for it
  # says why: a suite that invokes the binary directly never executes the
  # launcher at all, and a launcher that stopped working produces exactly the
  # empty stdout a clean call produces. The file is a polyglot -- cmd.exe runs
  # the batch half, every other shell runs the POSIX half -- so neither half is
  # exercised by driving the other, and Windows is a shipped target.
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The launcher resolves, denies, and is executable in the index
        if: runner.os != 'Windows'
        run: make launcher

      # `make` is not something this repository is willing to assume on the
      # Windows image, and a job that failed for want of make would be red for
      # a reason that says nothing about the launcher. So the Windows lane runs
      # the gate's own script; the Makefile rule is a one-line wrapper around
      # exactly this, and gate-drift's `make launcher` assertion is satisfied by
      # the step above.
      - name: The launcher resolves, denies, and is executable in the index
        if: runner.os == 'Windows'
        run: python scripts/check-launcher.py

  # Every assertion this gate makes has a spelling that passes on a launcher
  # that enforces nothing, and the mode bit is the one with a shipped bug
  # behind it: exit-status-guard 1.0.0 went out at 644, the shell refused it
  # with 126, and the guard never fired once.
  #
  # The deny mutation is the other half. A launcher that cannot find a binary
  # and exits non-zero without writing a decision object lets the tool call
  # through, and the gate has to be the thing that notices -- because nothing
  # in a transcript ever will.
  #
  # The endings control is the one that has to run on Windows, because what it
  # asserts is behaviour rather than bytes: flatten the file to LF and put a
  # parenthesized block back, and cmd.exe loses its file position, the `goto`
  # after the block cannot find its label, and the launcher exits without
  # denying. Asserting that on ubuntu would only re-check the byte counter this
  # gate already reads, which is not the property that matters.
  launcher-mutation-control:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Measured 2026-08-25 in four arms on a throwaway branch: LF-only plus a
      # parenthesized block gives `The system cannot find the batch label
      # specified - deny_missing`, exit 1, empty stdout -- which is not a deny,
      # so the tool call runs unscanned. Removing the block made the symptom go
      # away and left the defect; the endings are what fix it. This step is the
      # transplant of that arm, so the repo owns the reproduction rather than a
      # branch nobody keeps.
      #
      # The mutation text is verbatim from that arm and its output was checked
      # byte-for-byte against it. That is not fastidiousness. An earlier
      # spelling inserted a block of its own shaping, which flattened the
      # endings and left the deny reachable -- so the byte assertion reddened
      # and the behaviour did not change, and the step passed its own
      # preconditions while testing nothing. What the failure needs is not a
      # block somewhere but a `goto` reached by FALLING THROUGH past one: a
      # `goto` that jumps in resets cmd.exe's file position and survives. Do
      # not re-shape this mutation without re-driving it on Windows.
      - name: LF endings with a block present must fail the gate on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'MUTATE'
          import pathlib
          p = pathlib.Path("hooks/run-spill-guard.cmd")
          text = p.read_text(encoding="utf-8")          # universal newlines -> LF
          straight = """:try_path
          where spill-guard >nul 2>nul
          if errorlevel 1 goto :try_default
          spill-guard %*
          exit /b %ERRORLEVEL%

          :try_default
          if not exist "%LOCALAPPDATA%\\spill-guard\\bin\\spill-guard.exe" goto :deny_missing
          """.replace("\n          ", "\n")
          block = """:try_path
          for /f "delims=" %%P in ('where spill-guard 2^>nul') do (
              "%%P" %*
              exit /b %ERRORLEVEL%
          )

          if exist "%LOCALAPPDATA%\\spill-guard\\bin\\spill-guard.exe" goto :run_default
          echo run-spill-guard.cmd: no spill-guard.exe on PATH or under LOCALAPPDATA. >&2
          goto :deny_missing

          :run_default
          """.replace("\n          ", "\n")
          if straight not in text:
              raise SystemExit("the straight-line PATH route is not in the launcher any more")
          p.write_text(text.replace(straight, block, 1), encoding="utf-8", newline="\n")
          MUTATE
          if git diff --quiet -- hooks/run-spill-guard.cmd; then
            echo "::error::the mutation changed nothing -- it no longer matches the launcher" >&2
            exit 1
          fi
          if ! python -c "import pathlib,sys; d=pathlib.Path('hooks/run-spill-guard.cmd').read_bytes(); sys.exit(0 if d.count(b'\r\n')==0 and b'for /f' in d else 1)"; then
            echo "::error::the file is not uniform LF with a block, so this step tested nothing" >&2
            exit 1
          fi
          echo "mutation landed: uniform LF, block present"
          python scripts/check-launcher.py > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- hooks/run-spill-guard.cmd
          if [ "$rc" -eq 0 ]; then
            echo "::error::the gate passed on a launcher whose deny path does not run" >&2
            exit 1
          fi
          # Both, and the second is the point. The endings assertion reddens on
          # any flattening, so requiring only that would test the assertion
          # rather than the behaviour -- and an earlier spelling of this step
          # mutated to a shape that tripped the assertion without reproducing
          # the failure, which is exactly the hole these two greps close.
          if ! grep -q 'would run unscanned' mutant.log; then
            echo "::error::the gate failed, but not on the deny that never arrives" >&2
            exit 1
          fi
          if ! grep -q 'cannot find the batch label' mutant.log; then
            echo "::error::cmd.exe did not report a lost label, so this is not the failure that was measured" >&2
            exit 1
          fi

      - name: A launcher that is not executable in the index must fail the gate
        if: runner.os != 'Windows'
        run: |
          git update-index --chmod=-x hooks/run-spill-guard.cmd
          if [ "$(git ls-files -s -- hooks/run-spill-guard.cmd | cut -d' ' -f1)" = "100755" ]; then
            echo "::error::--chmod=-x changed nothing, so this step tested nothing" >&2
            exit 1
          fi
          make launcher > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git update-index --chmod=+x hooks/run-spill-guard.cmd
          if [ "$rc" -eq 0 ]; then
            echo "::error::the launcher gate passed on a launcher the shell would refuse" >&2
            exit 1
          fi
          if ! grep -q 'in the index' mutant.log; then
            echo "::error::the gate failed, but not on the index mode" >&2
            exit 1
          fi

      - name: A launcher that exits non-zero instead of denying must fail the gate
        if: runner.os != 'Windows'
        run: |
          python3 - <<'MUTATE'
          import pathlib
          # Bytes, not text. read_text/write_text translate line endings, so a
          # text round-trip flattens all 75 CRLF on top of the deny mutation --
          # which passes for the right reason on POSIX and makes the log read
          # as though the endings assertion caught the deny. Compound mutations
          # are what step 1 of this job exists to warn about.
          p = pathlib.Path("hooks/run-spill-guard.cmd")
          data = p.read_bytes()
          old = b"    printf '%s\\n' \"$1\"\n    exit 0\n"
          if old not in data:
              raise SystemExit("the deny body is not in the launcher any more")
          p.write_bytes(data.replace(old, b"    exit 1\n", 1))
          MUTATE
          if [ "$(python3 -c "import pathlib; print(pathlib.Path('hooks/run-spill-guard.cmd').read_bytes().count(b'\r\n'))")" != "85" ]; then
            echo "::error::the mutation moved the line endings, so this step is testing two things at once" >&2
            exit 1
          fi
          if git diff --quiet -- hooks/run-spill-guard.cmd; then
            echo "::error::the mutation changed nothing -- it no longer matches the launcher" >&2
            exit 1
          fi
          make launcher > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- hooks/run-spill-guard.cmd
          if [ "$rc" -eq 0 ]; then
            echo "::error::the launcher gate passed on a launcher that fails open" >&2
            exit 1
          fi
          # Anchored on the consequence rather than on the wording of the
          # finding: the message is prose and prose gets edited, and a control
          # that greps for a sentence goes green-then-wrong the day somebody
          # rewrites it. This exact grep broke once already, on a reword.
          if ! grep -q 'would run unscanned' mutant.log; then
            echo "::error::the gate failed, but not on the missing deny" >&2
            exit 1
          fi

      # The launcher is blind to the event it was invoked for, and until
      # hooks.json existed nothing invoked it, so the shape it writes was never
      # tested against a prompt. It wrote the PreToolUse `hookSpecificOutput`
      # object, which internal/hook/verdict.go measures as accepted and IGNORED
      # on UserPromptSubmit -- so a fresh install with no binary denied Read
      # and Bash loudly while every prompt went to the model unscanned.
      #
      # This transplants that exact shape back, byte for byte from the tree
      # before the fix, and requires the gate to name it. A control that merely
      # corrupted the JSON would prove the parser rejects garbage, which is not
      # the property: the broken shape is valid JSON and a valid PreToolUse
      # verdict, and it is wrong only because this file cannot see the event.
      - name: The event-blind PreToolUse deny object must fail the gate
        if: runner.os != 'Windows'
        run: |
          python3 - <<'MUTATE'
          import pathlib
          p = pathlib.Path("hooks/run-spill-guard.cmd")
          data = p.read_bytes()
          old = b'{"decision":"block","reason":"'
          if data.count(old) != 4:
              raise SystemExit(f"expected 4 block objects, found {data.count(old)}")
          data = data.replace(
              old,
              b'{"hookSpecificOutput":{"hookEventName":"PreToolUse",'
              b'"permissionDecision":"deny","permissionDecisionReason":"')
          # The nested object closes twice. Only the four deny lines end this
          # way, which the count above has already established.
          data = data.replace(b'."}', b'."}}')
          p.write_bytes(data)
          MUTATE
          if ! grep -q 'hookSpecificOutput' hooks/run-spill-guard.cmd; then
            echo "::error::the mutation did not put the PreToolUse shape back, so this step tested nothing" >&2
            git checkout -- hooks/run-spill-guard.cmd
            exit 1
          fi
          if ! python3 -c "
          import json, pathlib, sys
          data = pathlib.Path('hooks/run-spill-guard.cmd').read_bytes().decode()
          line = [l for l in data.splitlines() if l.startswith('DENY_MISSING=')][0]
          json.loads(line.split('=', 1)[1].strip().strip(chr(39)))
          "; then
            echo "::error::the mutated deny is not valid JSON, so the gate would fail on parsing rather than on the shape" >&2
            git checkout -- hooks/run-spill-guard.cmd
            exit 1
          fi
          make launcher > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- hooks/run-spill-guard.cmd
          if [ "$rc" -eq 0 ]; then
            echo "::error::the launcher gate passed on a deny Claude Code ignores on UserPromptSubmit" >&2
            exit 1
          fi
          if ! grep -q 'IGNORES that on UserPromptSubmit' mutant.log; then
            echo "::error::the gate failed, but not on the event-blind shape" >&2
            exit 1
          fi

      # One byte, and the quietest mutation this file has. The terminator's CR
      # is also sh's heredoc delimiter -- line 1 opens with `: << 'CMDBLOCK'`
      # and keeps its CR, so the delimiter is `CMDBLOCK\r`. Drop it and sh
      # swallows the whole POSIX half, and the launcher exits 0 with empty
      # stdout and empty stderr. Silent, where the cmd.exe defect at least
      # exited 1.
      #
      # POSIX-only, and this comment said "every platform" until a review drove
      # it: every batch path leaves at an `exit /b` well above the terminator,
      # so cmd.exe never reads that line, and the four-arm probe agrees --
      # Windows passed the arm whose terminator carried no CR. Which is why
      # this step is ubuntu-only: not merely a sufficient platform, the only
      # one where it manifests. Windows's cover for that byte is the assertion.
      #
      # It is a one-character edit any editor can make, so it gets a control
      # rather than a sentence.
      - name: Dropping the terminator's CR must fail the gate
        if: runner.os != 'Windows'
        run: |
          python3 - <<'MUTATE'
          import pathlib
          p = pathlib.Path("hooks/run-spill-guard.cmd")
          data = p.read_bytes()
          if data.count(b"CMDBLOCK\r\n") != 1:
              raise SystemExit("the CRLF-terminated CMDBLOCK line is not there to break")
          p.write_bytes(data.replace(b"CMDBLOCK\r\n", b"CMDBLOCK\n", 1))
          MUTATE
          if git diff --quiet -- hooks/run-spill-guard.cmd; then
            echo "::error::the mutation changed nothing" >&2
            exit 1
          fi
          make launcher > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- hooks/run-spill-guard.cmd
          if [ "$rc" -eq 0 ]; then
            echo "::error::the gate passed on a launcher that is silently inert on macOS and Linux" >&2
            exit 1
          fi
          # Both, because they are independent: the byte assertion sees the
          # terminator, and the behavioural cases see a launcher that exits 0
          # saying nothing. A spelling that lost one would still pass on the
          # other, and the pair is what says so.
          if ! grep -q 'line carries no CR' mutant.log; then
            echo "::error::the endings assertion did not name the terminator" >&2
            exit 1
          fi
          if ! grep -q 'would run unscanned' mutant.log; then
            echo "::error::the deny cases did not notice a launcher that says nothing at all" >&2
            exit 1
          fi

      # The direction a red-only control cannot reach: the gate must not report
      # a finding on a machine that has spill-guard installed, which is every
      # machine once this ships. The deny cases hide the tool by dropping the
      # directory that holds it, and a spelling that names directories to keep
      # instead would go green here and red on a contributor's laptop.
      - name: The gate must still pass with a spill-guard on PATH
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$HOME/fake-bin"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/fake-bin/spill-guard"
          chmod +x "$HOME/fake-bin/spill-guard"
          export PATH="$HOME/fake-bin:$PATH"
          command -v spill-guard || { echo "::error::the fixture is not on PATH, so this step tested nothing" >&2; exit 1; }
          make launcher

  # `make check` is a loop over GATES, and a loop is how a run reports green
  # while a gate it was supposed to cover failed -- take the status from the
  # last iteration and every earlier failure vanishes. Same defect the
  # cross-compile control exists for, one level up. So the mutation breaks a
  # gate that is not last, and both halves are asserted: that check goes red,
  # and that it carried on to the end anyway.
  check-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Break a gate that is not the last one
        run: printf '\n[mutant](docs/design/no-such-file.md)\n' >> README.md
      - name: check must fail, and must still have run the gates after it
        run: |
          make check > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- README.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::make check passed with the docs gate broken" >&2
            exit 1
          fi
          if ! grep -q 'all 5 targets build' mutant.log; then
            echo "::error::check stopped at the failing gate, so this run does not show it reaching the end" >&2
            exit 1
          fi

  # Two files here are copies of tooling that lives in a private repo, so
  # nothing can ask whether upstream has moved. What is local is whether the
  # copy still is one -- a fix typed into it helps this repo, reaches no other
  # repo running the same tooling, and is gone at the next re-vendor.
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Every vendored copy still hashes to its declared digest
        run: make vendor

  # Three mutations. The first is the defect the gate exists for. The second is
  # the property that made the layout worth changing: the files checked come
  # from the tree, so a third copy nobody declared is a failure rather than a
  # row a manifest was never given. The third breaks the record instead of the
  # files -- a table this cannot find declares no digest at all, which is the
  # spelling that passes over everything.
  vendor-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # One byte, which is what a real fix looks like from the outside. The
      # message is half the deliverable: a red gate that does not say which of
      # the copies moved sends a reader to diff all of them.
      - name: A vendored file edited in place must fail the gate, by name
        run: |
          printf '\n# mutant\n' >> scripts/vendor/claude-skills/queue.py
          make vendor > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- scripts/vendor/claude-skills/queue.py
          if [ "$rc" -eq 0 ]; then
            echo "::error::vendor passed with a vendored file edited in place" >&2
            exit 1
          fi
          if ! grep -q 'vendor/claude-skills/queue.py hashes to' mutant.log; then
            echo "::error::vendor failed, but did not name the file that drifted" >&2
            exit 1
          fi

      # The one a manifest cannot do. A manifest checks the rows it holds, so a
      # copy added without a row is invisible to it -- silence, which is the
      # failure shape this repo keeps designing out.
      - name: A vendored file nothing declares must fail the gate
        run: |
          printf '#!/usr/bin/env python3\n' > scripts/vendor/claude-skills/mutant.py
          git add -N scripts/vendor/claude-skills/mutant.py
          make vendor > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git rm -q --cached scripts/vendor/claude-skills/mutant.py
          rm -f scripts/vendor/claude-skills/mutant.py
          if [ "$rc" -eq 0 ]; then
            echo "::error::vendor passed with an undeclared file under scripts/vendor/" >&2
            exit 1
          fi
          if ! grep -q 'mutant.py is vendored and nothing declares' mutant.log; then
            echo "::error::vendor failed, but not on the undeclared file" >&2
            exit 1
          fi

      # A reformat of the page is how the record goes missing in practice, and
      # a parse that finds no table has nothing to disagree with. Renaming the
      # header leaves a table sitting right there, which is what makes this the
      # honest version of the mutation.
      - name: A digest table the gate cannot find must fail it, not pass it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/README.md")
          t = p.read_text()
          old = "| Here | Upstream path | Taken from | sha256 |\n"
          assert t.count(old) == 1, "the digest table header has moved"
          p.write_text(t.replace(old, "| File | Source | Commit | Digest |\n"))
          PY
          make vendor > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- scripts/README.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::vendor passed over a README declaring no digest" >&2
            exit 1
          fi
          if ! grep -q 'no digest is declared anywhere' mutant.log; then
            echo "::error::vendor failed, but not on the missing table" >&2
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Every relative link resolves, fragment included
        run: make docs

  # The link check passes on a repo with no links at all, so on its own it
  # cannot tell "all links resolve" from "the checker found nothing to check".
  # Break one and require red -- once per half of a link, because the path and
  # the fragment are separate reads and a control over one says nothing about
  # the other.
  #
  # The rest run the other way. Four shapes must not fail the gate: a link
  # quoted in a code span, a link shown inside an indented code block, a link to
  # a setext heading, and a link inside a fence nested in another. Three must
  # still fail it, because the obvious way to reach those greens overshoots --
  # reading setext without dropping frontmatter first turns `size: S` into an
  # anchor in every row of the store, stripping four-space indentation without
  # list context drops every link nested at that column, and reading a fence
  # marker at any indent skips from an indented example to whatever fence comes
  # next. Measured 2026-08-23: each of Q32's four steps is reddened by a
  # different spelling of the fix, and only the shipped one passes all four.
  docs-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: A link to a file that does not exist must fail the gate
        run: |
          printf '\n[mutant](docs/design/no-such-file.md)\n' >> README.md
          make docs > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- README.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::the link check passed with a broken link in README.md" >&2
            exit 1
          fi
          if ! grep -q '^broken link: README.md' mutant.log; then
            echo "::error::the link check failed, but not on the missing file" >&2
            exit 1
          fi

      # The fragment half has a spelling that throws every fragment away and
      # still prints "all relative links resolve" -- which is what this gate did
      # until Q25. So the path mutation above cannot stand in for this one.
      - name: A link to a heading that does not exist must fail the gate
        run: |
          printf '\n[mutant](docs/design/README.md#no-such-heading)\n' >> README.md
          make docs > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- README.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::the link check passed with a link to a heading that does not exist" >&2
            exit 1
          fi
          if ! grep -q '^broken anchor: README.md' mutant.log; then
            echo "::error::the link check failed, but not on the anchor" >&2
            exit 1
          fi

      # Precision, and the direction a red-only control cannot reach. The store
      # quotes broken links as exhibits, so a checker that reads inside an
      # inline code span reports the exhibit as a defect -- Q25's own row was an
      # instance, and it leaves the tree with the row. Nothing else in the tree
      # carries the case, so this step is what keeps the stripping honest.
      #
      # The precondition arrived with Q32, which made the column the heredoc
      # lands at load-bearing: four spaces of it and the line is an indented
      # code block, which the checker now skips, and the step then demands a
      # green it would get from a checker that had stopped reading entirely.
      - name: A link quoted inside a code span must not fail the gate
        run: |
          cat >> README.md <<'MD'

          Quoting `[dead](#no-such-heading)` and `[gone](no-such-file.md)`.
          MD
          if ! grep -q '^Quoting `\[dead\]' README.md; then
            echo "::error::the mutation changed nothing -- the quoted link is not at column 0" >&2
            exit 1
          fi
          make docs > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- README.md
          if [ "$rc" -ne 0 ]; then
            echo "::error::the link check read a link out of an inline code span" >&2
            exit 1
          fi

      # Q32's first half, and a direction only a green-demanding control
      # reaches: a setext heading has to contribute an anchor, and until this
      # it contributed nothing, so a link to one failed.
      - name: A link to a setext heading must pass the gate
        run: |
          printf '\n## Mutant setext\n\nMutant heading\n==============\n\n[mutant](#mutant-heading)\n' \
            >> README.md
          if ! grep -qx '==============' README.md; then
            echo "::error::the mutation changed nothing -- no setext underline in README.md" >&2
            exit 1
          fi
          make docs > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- README.md
          if [ "$rc" -ne 0 ]; then
            echo "::error::the link check does not read a setext heading as one" >&2
            exit 1
          fi

      # The trap Q32 names, and why the walk drops frontmatter before it reads
      # a heading at all: every row in docs/queue closes its frontmatter with a
      # `---`, so a checker that reads setext without skipping it first turns
      # `size: S` into an anchor in all of them. The fixture carries one key on
      # purpose -- a naive reader taking only the line above the `---` and one
      # taking the whole paragraph then agree on `size-s`, so this step catches
      # both spellings. Measured 2026-08-23 against both.
      - name: A frontmatter close must not offer an anchor
        run: |
          printf '%s\n' '---' 'size: S' '---' '' '# Real heading' > mutant-frontmatter.md
          printf '\n## Mutant frontmatter\n\n[mutant](mutant-frontmatter.md#size-s)\n' >> README.md
          make docs > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- README.md
          rm -f mutant-frontmatter.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::the link check read a frontmatter close as a setext heading" >&2
            exit 1
          fi
          if ! grep -q '^broken anchor: README.md' mutant.log; then
            echo "::error::the link check failed, but not on the frontmatter anchor" >&2
            exit 1
          fi

      # Q32's second half. Four-space indentation is the third way to write
      # code in markdown and the checker did not strip it, so a doc showing a
      # link as an example failed on it. The precondition is the indentation
      # itself rather than the append: this step is the one that passes
      # vacuously if the four spaces do not survive into README.md.
      - name: A link inside an indented code block must not fail the gate
        run: |
          printf '\n## Mutant indent\n\nExample:\n\n    [mutant](no-such-file.md)\n' >> README.md
          if ! grep -qx '    \[mutant\](no-such-file.md)' README.md; then
            echo "::error::the mutation changed nothing -- the link is not indented four spaces" >&2
            exit 1
          fi
          make docs > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- README.md
          if [ "$rc" -ne 0 ]; then
            echo "::error::the link check read a link out of an indented code block" >&2
            exit 1
          fi

      # The other side of that one, and the reason the strip needs list
      # context: four spaces is a code block only outside a list, and this repo
      # nests plenty of items at that column. A checker that reads the indent
      # alone drops every link in them and reports nothing, which is the shape
      # a red-only job cannot tell from a clean tree. The blank line is
      # load-bearing -- without it the nested item is a lazy continuation of
      # the outer one, which no implementation reads as code, so the step would
      # pass either way.
      - name: A link in a list item indented four spaces must fail the gate
        run: |
          printf '\n## Mutant list\n\n- outer item\n\n    - nested, with [a link](no-such-file.md)\n' \
            >> README.md
          make docs > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- README.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::the link check read a nested list item as an indented code block" >&2
            exit 1
          fi
          if ! grep -q '^broken link: README.md' mutant.log; then
            echo "::error::the link check failed, but not on the nested item" >&2
            exit 1
          fi

      # Q41's first half, and the shape this repo's own gate docs are made of: a
      # doc showing a fenced block wraps it in a longer fence or in the other
      # marker, and a checker flipping a boolean on every marker lets the inner
      # fence close the outer one. The link inside is then read as prose. One
      # rule closes all three spellings, so they share a step.
      #
      # A green here means the checker reported nothing about README.md, which is
      # also what it reports when it read nothing at all -- so the step carries
      # both halves of that. The same three links go in unfenced first and have
      # to come back red, which is what says the checker is still reading this
      # file; and the outer markers have to land at column 0, since four spaces
      # of heredoc indentation makes the whole block indented code and the green
      # below would then be about nothing.
      - name: A link inside a nested fence must not fail the gate
        run: |
          cat >> README.md <<'MD'

          ## Mutant nesting control

          [nest-a](no-such-file.md)
          [nest-b](no-such-file.md)
          [nest-c](no-such-file.md)
          MD
          make docs > mutant.log 2>&1 && rc=0 || rc=$?
          echo "control exit: $rc"
          cat mutant.log
          git checkout -- README.md
          if [ "$rc" -eq 0 ] || [ "$(grep -c '^broken link: README.md' mutant.log)" -ne 3 ]; then
            echo "::error::the control reported no three unfenced links, so a green below would prove nothing" >&2
            exit 1
          fi

          cat >> README.md <<'MD'

          ## Mutant nesting

          `````markdown
          ```
          [nest-a](no-such-file.md)
          ```
          `````

          ~~~markdown
          ```
          [nest-b](no-such-file.md)
          ```
          ~~~

          ```markdown
          ~~~
          [nest-c](no-such-file.md)
          ~~~
          ```
          MD
          if [ "$(grep -c '^[`~]\{3,\}markdown$' README.md)" -ne 3 ]; then
            echo "::error::the mutation changed nothing -- the three outer fences are not at column 0" >&2
            exit 1
          fi
          make docs > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- README.md
          if [ "$rc" -ne 0 ]; then
            echo "::error::the link check read a link out of a fence nested inside another" >&2
            exit 1
          fi

      # Q41's other half, and the one that went the quiet way: the fence pattern
      # matched at any indentation, so a marker shown inside an indented code
      # block opened a block and the checker skipped to whatever fence came
      # next, reading nothing in between. A lone marker is what does it -- two
      # balance the flip and the link after is reported either way, which is how
      # this step passes while testing nothing. Measured 2026-08-25 at 5e47f92,
      # where the paired fixture reported the link and the lone one did not.
      #
      # So the precondition counts the fence-matching lines the append adds,
      # which pins the parity rather than one marker's spelling. An earlier
      # version grepped this fixture's own ```bash: a second indented marker
      # tagged anything else satisfied it, balanced the flip, and the step went
      # green with the bug present. Against the pre-fix checker the shipped
      # fixture is red on the marker and the paired one red on the precondition;
      # under that earlier spelling the paired fixture exited 0.
      #
      # Parity is not ordering, and ordering is left unpinned: the leak needs the
      # link below the marker, so a fixture with it moved above adds one marker
      # and exits 0 with the bug present. Pinning that means finding the marker
      # to compare line numbers, which is the spelling pin again. Re-drive the
      # inverted arm when this fixture changes.
      - name: A link after an indented fence marker must still fail the gate
        run: |
          before=$(grep -cE '^[[:space:]]*(```|~~~)' README.md)
          cat >> README.md <<'MD'

          ## Mutant indented marker

          To open a fence, write:

              ```bash

          and close it with the same marker.

          [mutant](no-such-file.md)
          MD
          if [ "$(( $(grep -cE '^[[:space:]]*(```|~~~)' README.md) - before ))" -ne 1 ]; then
            echo "::error::the mutation changed nothing -- the block must add exactly one fence marker, since an even count balances the flip" >&2
            exit 1
          fi
          make docs > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- README.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::the link check read an indented fence marker as opening a block" >&2
            exit 1
          fi
          if ! grep -q '^broken link: README\.md:[0-9]*: no-such-file\.md$' mutant.log; then
            echo "::error::the link check failed, but not on the link after the marker" >&2
            exit 1
          fi

  queue:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because `claims` measures this branch against its merge
      # base with origin/main. A shallow clone has no merge base, and under
      # --strict that is a failure rather than a skip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `lint` reports what the files alone cannot settle as a note at exit 0,
      # which is most of what a row-completing PR gets wrong. Measured
      # 2026-08-21 on a tree at b5c7207, by driving each case: a row linking a
      # deleted row, and `status: blocked` with the blocker line removed, both
      # exit 0. --strict promotes one named class, so the split below is the
      # decision here -- wiring the linter in as-is would gate close to nothing.
      #
      # Bound on every event, because the files in front of the checker settle
      # them:
      #   blocked-opener    a row saying `status: blocked` with nothing saying
      #                     what it waits on. This is the frontmatter flip left
      #                     half-applied -- the completion took the blocker line
      #                     and the status stayed -- and nothing else caught it.
      #   deferred-trigger  a parked row nothing can revive.
      #   empty-store       a store that loaded nothing. Every other assertion
      #                     here passes over zero items, so this is what stops
      #                     the job reading green on a store it never found.
      #   stale-citation    a `file.ext:N` pointer that no longer finds its
      #                     line. Bound here since Q45, with a cost that is
      #                     accepted rather than absent -- read the next block
      #                     before changing this.
      #
      # stale-citation is four checks under one name, and the axis that decides
      # where a defect surfaces is not which arm fired -- it is who moved the
      # line. That cuts across all four.
      #
      #   your own diff    the citation was correct when written and an edit in
      #                    the same PR moved it. The branch goes red, you
      #                    re-point it. This is what promotion buys, and it is
      #                    the whole of what promotion buys.
      #
      #   a sibling's      the branch stays green, because the pointer is still
      #                    correct against the tree in front of it, and main
      #                    reddens on the merge. Every arm behaves this way and
      #                    no event split reaches it. So Q45 narrows the
      #                    branch-green/main-red hole rather than closing it,
      #                    and MERGED=true on the trunk is what catches the
      #                    rest -- one merge late, by construction.
      #
      # Measured 2026-08-26 against live PR #28, which edits
      # scripts/check-doc-links.py. Citing a fragment only #28's version
      # carries: exit 2 here, exit 0 with its file present. Citing the fragment
      # at #28's line number: exit 2 here with "now at line 96", exit 0 with
      # its file present. Citing it at this branch's number: the reverse. And
      # self-inflicted drift on this tree, twenty lines inserted above a
      # citation exact at scripts/gates.py:40: exit 0 before, exit 2 after.
      #
      # The cost is taken rather than waived, and it is not one arm. Any pointer
      # describing the merged tree rather than this branch reddens here -- a
      # file a sibling adds, a fragment it adds, a line number only right once
      # it lands. All four checks behave alike, as the table above measures,
      # because lint sees one tree: which check fires depends on how the trees
      # differ, and which side reddens depends only on which tree the author
      # wrote against, which the checker cannot know. That is the dangling-link
      # case, and the pre-Q45 comment here said so: "or cite a line in a file
      # that PR is still adding".
      #
      # So no arm split separates the cost from the benefit, and Q67 is an open
      # question about an expiring marker rather than a split. `exhibit:` is
      # the nearest tool and the wrong one: it never expires, so the pointer
      # stays unchecked after the sibling lands, which is when checking it
      # would start working.
      #
      # Taken because the failure is loud, names the file, and repairs in a
      # line -- and it fails closed, which is this repository's posture
      # everywhere else. `make queue` is also the pre-commit hook, so it blocks
      # a commit and not only a CI run.
      #
      # Advisory on a pull request and bound on main:
      #   dangling-link     a row may legitimately link an item a sibling PR is
      #                     still filing. Both PRs are correct and the merged
      #                     set is correct; only the branch carrying the link
      #                     is red, and only until the sibling lands. The merged
      #                     tree holds both sides, so main is the first place
      #                     the answer is not a guess -- one merge later than a
      #                     PR gate and the earliest point it can be right.
      #
      # MERGED is what selects between the two sets, and it now names one class
      # rather than two. The lists themselves live in the Makefile, beside the
      # target that reads them, so the pre-commit hook and this job promote the
      # same classes.
      #
      # The other two assertions `make queue` runs:
      #
      #   claims --strict   a hand-picked id collides at the rebase, by which
      #                     point two rows share a filename and one has to be
      #                     renamed. --strict because a runner has a network:
      #                     without it an unreachable remote skips, and a skip
      #                     reads exactly like a pass. This binds on a pull
      #                     request and is a no-op on a push, where the merge
      #                     base with origin/main is HEAD and no branch adds
      #                     anything -- by then the collision has landed.
      #   check-queue-index  no rendered index is committed.
      - name: The store's rules hold, ids hold claims, no index is committed
        run: make queue MERGED=${{ github.event_name == 'push' }}

      # Render on demand is the whole point, so render it here: the ordered
      # backlog is readable from the Actions tab without a checkout. The item
      # links are store-relative, which resolves nowhere in a summary, so they
      # are rewritten at the blob for the commit under test.
      - name: The ordered backlog, in the job summary
        if: always()
        continue-on-error: true
        env:
          BLOB: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/queue
        run: |
          {
            echo "## Backlog"
            echo
            python3 scripts/vendor/claude-skills/queue.py render --format table --all \
              | sed "s|](\(Q[0-9]\{1,\}\)\.md)|]($BLOB/\1.md)|g"
          } >> "$GITHUB_STEP_SUMMARY"

  # Every assertion in the queue job has a spelling that passes on a store with
  # nothing in it or a gate that skipped, and `blocked-opener` and
  # `dangling-link` were both measured exiting 0 before the job promoted them.
  # So each gate gets a mutation that breaks its property and has to come back
  # red -- and, where the message is the deliverable, red for the stated reason.
  #
  # These steps edit the store and put it back with `git checkout -- docs/queue`,
  # which is safe on a runner's clean checkout and will discard uncommitted work
  # if you run one by hand. Commit first.
  queue-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The measured failure: a completion applied to the prose and not to the
      # frontmatter. Both halves are asserted -- that it fails, and that it
      # offers the status flip. A message naming only `Blocked by …` sends the
      # next completing session to restore a dependency that has shipped.
      # The subject is written here rather than found in the store. This used
      # to strip the opener off whichever row was blocked, which made the step
      # depend on the store holding one -- a property nothing enforces and that
      # any pull request may remove. Completing Q50 unblocked Q9 and Q10, the
      # only two, and the step failed on `no blocked row carries an opener to
      # strip`: a control reporting red because it had nothing to test, which
      # is the one verdict a control must never give.
      #
      # The rank comes from the store's own tool, so the synthetic row is
      # well-formed and `blocked-opener` is the only class it can trip. A row
      # with a hand-typed rank also fails this lint, for a reason the grep
      # below would not have separated from the one being tested.
      - name: A blocked row with no blocker line must fail the gate
        run: |
          rank=$(python3 scripts/vendor/claude-skills/queue.py rank --tail)
          [ -n "$rank" ] || { echo "::error::no rank, so no well-formed subject" >&2; exit 1; }
          printf -- '---\nid: Q999999\nrank: %s\nlabels:\n    - tests\nstatus: blocked\nsize: S\n---\n\n# A synthetic blocked row, written by the mutation control\n\nIt names no blocker, which is the defect under test.\n' "$rank" \
            > docs/queue/Q999999.md
          if [ ! -s docs/queue/Q999999.md ]; then
            echo "::error::the subject was not written, so this step tested nothing" >&2
            exit 1
          fi
          python3 scripts/vendor/claude-skills/queue.py lint --strict blocked-opener \
            > mutant.log 2>&1 && rc=0 || rc=$?
          echo "lint exit: $rc"
          cat mutant.log
          rm -f docs/queue/Q999999.md
          git checkout -- docs/queue
          if [ "$rc" -eq 0 ]; then
            echo "::error::lint passed with a blocked row that names no blocker" >&2
            exit 1
          fi
          if ! grep -q 'set `status: ready` instead' mutant.log; then
            echo "::error::lint failed, but did not offer the status flip" >&2
            exit 1
          fi

      # The other half of the same defect: the frontmatter stayed blocked and
      # the blocker line stayed too, so only the shipped row is missing. This is
      # the class that is advisory on a PR, so the mutation runs main's set.
      # Synthesized for the reason the step above is, and it is the same two
      # rows: this one needs a blocked row whose link resolves, which is a
      # narrower thing for the store to happen to hold than the step above
      # needed, and it goes away on exactly the same pull request.
      #
      # The pair is linted BEFORE the mutation and required green. Without
      # that, a synthetic row malformed in some way this step does not think
      # about would redden `dangling-link` on its own and the assertion below
      # would read it as the mutation working.
      - name: A row waiting on a shipped item must fail the gate on main
        run: |
          blocker=$(python3 scripts/vendor/claude-skills/queue.py rank --tail)
          waiter=$(python3 scripts/vendor/claude-skills/queue.py rank --after "$blocker")
          [ -n "$blocker" ] && [ -n "$waiter" ] || { echo "::error::no ranks, so no well-formed subjects" >&2; exit 1; }
          printf -- '---\nid: Q999998\nrank: %s\nlabels:\n    - tests\nstatus: ready\nsize: S\n---\n\n# A synthetic blocker, written by the mutation control\n\nThe row below waits on this one.\n' "$blocker" \
            > docs/queue/Q999998.md
          printf -- '---\nid: Q999999\nrank: %s\nlabels:\n    - tests\nstatus: blocked\nsize: S\n---\n\n# A synthetic waiter, written by the mutation control\n\nBlocked by [Q999998](Q999998.md). The blocker is about to ship.\n' "$waiter" \
            > docs/queue/Q999999.md
          python3 scripts/vendor/claude-skills/queue.py lint --strict dangling-link --strict blocked-opener \
            > mutant.log 2>&1 && rc=0 || rc=$?
          echo "--- the pair, unmutated -- lint exit: $rc"
          cat mutant.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::the synthetic pair is not lint-clean, so the red below would not be the mutation" >&2
            rm -f docs/queue/Q999998.md docs/queue/Q999999.md
            exit 1
          fi
          rm -f docs/queue/Q999998.md
          echo "completed Q999998, which Q999999 waits on"
          python3 scripts/vendor/claude-skills/queue.py lint --strict dangling-link \
            > mutant.log 2>&1 && rc=0 || rc=$?
          echo "--- the blocker shipped -- lint exit: $rc"
          cat mutant.log
          rm -f docs/queue/Q999998.md docs/queue/Q999999.md
          git checkout -- docs/queue
          if [ "$rc" -eq 0 ]; then
            echo "::error::lint passed with a row waiting on an item that shipped" >&2
            exit 1
          fi
          if ! grep -q 'set `status: ready` and drop the blocker line' mutant.log; then
            echo "::error::lint failed, but did not name the frontmatter flip" >&2
            exit 1
          fi

      # Two more classes the queue job promotes. Neither is load-bearing for a
      # completion, and both are here for the same reason as the rest: a class
      # promoted and never shown failing is a claim. This drives the linter
      # directly, so it shows the class can fail and says nothing about which
      # events promote it; the step after it is what reads the gate.
      #
      # The parked row is synthesized like the two above. Unlike them, nothing
      # has emptied the deferred class yet -- Q23 and Q24 are still there. It
      # is the same mechanism a completion breaks, though, and leaving one step
      # hunting the store while its neighbours write their own subject is a job
      # doing one thing two ways with nothing saying which is meant.
      - name: A parked row with no trigger, and a citation past a file's end
        run: |
          rank=$(python3 scripts/vendor/claude-skills/queue.py rank --tail)
          [ -n "$rank" ] || { echo "::error::no rank, so no well-formed subject" >&2; exit 1; }
          printf -- '---\nid: Q999997\nrank: %s\nlabels:\n    - tests\nstatus: deferred\nsize: S\n---\n\n# A synthetic parked row, written by the mutation control\n\nThe note names nothing that would bring it back.\n' "$rank" \
            > docs/queue/Q999997.md
          python3 - <<'PY'
          import pathlib
          store = pathlib.Path("docs/queue")
          cited = sorted(store.glob("Q*.md"))[0]
          cited.write_text(
              cited.read_text(encoding="utf-8")
              + "\n\nMeasured at scripts/vendor/claude-skills/queue.py:999999.\n",
              encoding="utf-8")
          print(f"pointed {cited.name} past the end of the vendored queue.py")
          PY
          python3 scripts/vendor/claude-skills/queue.py lint --strict deferred-trigger \
            > mutant.log 2>&1 && rc=0 || rc=$?
          echo "--- deferred-trigger -- lint exit: $rc"
          cat mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::lint passed with a parked row nothing can revive" >&2
            rm -f docs/queue/Q999997.md
            git checkout -- docs/queue
            exit 1
          fi
          # Anchored on the message, as the two steps beside it are. Asserting
          # only a non-zero exit would let any other finding stand in for this
          # one -- a malformed rank fails the same lint, and the class under
          # test would never be exercised.
          if ! grep -q 'names no trigger' mutant.log; then
            echo "::error::lint failed, but not on the missing revive trigger" >&2
            rm -f docs/queue/Q999997.md
            git checkout -- docs/queue
            exit 1
          fi
          python3 scripts/vendor/claude-skills/queue.py lint --strict stale-citation \
            > mutant.log 2>&1 && rc=0 || rc=$?
          echo "--- stale-citation -- lint exit: $rc"
          cat mutant.log
          rm -f docs/queue/Q999997.md
          git checkout -- docs/queue
          if [ "$rc" -eq 0 ]; then
            echo "::error::lint passed with a citation past the end of its file" >&2
            exit 1
          fi
          if ! grep -q 'past the end of a' mutant.log; then
            echo "::error::lint failed, but not on the citation" >&2
            exit 1
          fi

      # Q45. Every control above drives `queue.py lint --strict <class>` by
      # hand, which shows a class can fail and cannot show which events promote
      # it -- exactly the gap Q45 was filed against, where the trunk bound
      # stale-citation and no pull request did. So this one reads the gate:
      # `make queue` with MERGED unset is the pull-request invocation, and the
      # claim is that it now fails.
      #
      # MERGED=true first, on the same mutated tree, as the precondition. That
      # arm bound stale-citation before Q45 and binds it after, so it fails for
      # a citation that is genuinely stale and passes for a mutation that did
      # not land -- which is what stops the arm below reading green against a
      # tree carrying no defect. Then the restore is asserted green, so the red
      # in between is the citation rather than anything ambient.
      - name: A stale citation must fail the gate on a pull request, not only on main
        run: |
          cited=$(ls docs/queue/Q*.md | head -1)
          printf '\n\nMeasured at `scripts/check-queue-index.py:1:NO_SUCH_TOKEN`.\n' >> "$cited"
          echo "planted a citation $cited names and check-queue-index.py does not carry"
          make queue MERGED=true > mutant.log 2>&1 && rc=0 || rc=$?
          echo "--- MERGED=true -- make queue exit: $rc"
          cat mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::the mutation did not land: main's own set passed over it" >&2
            git checkout -- docs/queue
            exit 1
          fi
          make queue > mutant.log 2>&1 && rc=0 || rc=$?
          echo "--- MERGED unset -- make queue exit: $rc"
          cat mutant.log
          git checkout -- docs/queue
          if [ "$rc" -eq 0 ]; then
            echo "::error::the pull-request gate passed over a stale citation" >&2
            exit 1
          fi
          # Anchored on `^queue: Q` rather than on the message text: a note
          # and a failure carry the same words and differ only in the `note: `
          # the linter prefixes, so an unanchored grep cannot tell a promoted
          # failure from the note this step exists to say we no longer get.
          if ! grep -q '^queue: Q.*no longer carries' mutant.log; then
            echo "::error::the gate failed, but not on the citation" >&2
            exit 1
          fi
          make queue > restored.log 2>&1 && rc=0 || rc=$?
          echo "--- restored -- make queue exit: $rc"
          cat restored.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::the gate is red on the restored tree, so the red above was not the citation" >&2
            exit 1
          fi

      # Nothing else in the job distinguishes "every rule holds" from "no item
      # was read". A --store that resolves nowhere is how that happens in
      # practice, and it is one typo away in every caller.
      - name: A store with no items in it must fail the gate
        run: |
          mkdir -p mutant-store
          python3 scripts/vendor/claude-skills/queue.py --store mutant-store lint --strict empty-store \
            > mutant.log 2>&1 && rc=0 || rc=$?
          echo "lint exit: $rc"
          cat mutant.log
          rmdir mutant-store
          if [ "$rc" -eq 0 ]; then
            echo "::error::lint passed over a store holding no items" >&2
            exit 1
          fi

      # One mutation per signal. The rendered form is how an index actually gets
      # committed -- someone runs render and saves it -- and a check that only
      # catches that shape says nothing about an index somebody typed, which is
      # the same contention with none of the same text in it.
      - name: Each shape of committed index must fail the check
        run: |
          python3 scripts/vendor/claude-skills/queue.py render --format table --all > docs/queue/INDEX.md
          git add -N docs/queue/INDEX.md
          python3 scripts/check-queue-index.py > mutant.log 2>&1 && rc=0 || rc=$?
          echo "--- rendered index -- check exit: $rc"
          cat mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::the index check passed with a rendered index committed" >&2
            exit 1
          fi
          if ! grep -q 'carries the header' mutant.log; then
            echo "::error::the index check failed, but not on the render signature" >&2
            exit 1
          fi

          { echo "# Backlog"; echo; } > docs/queue/INDEX.md
          for f in docs/queue/Q[0-9]*.md; do
            id=$(basename "$f" .md)
            echo "- [$id]($id.md)" >> docs/queue/INDEX.md
          done
          python3 scripts/check-queue-index.py > mutant.log 2>&1 && rc=0 || rc=$?
          echo "--- hand-rolled index -- check exit: $rc"
          cat mutant.log
          git rm -q --cached docs/queue/INDEX.md
          rm -f docs/queue/INDEX.md
          if [ "$rc" -eq 0 ]; then
            echo "::error::the index check passed with a hand-rolled index committed" >&2
            exit 1
          fi
          if ! grep -q 'reads as an enumeration' mutant.log; then
            echo "::error::the index check failed, but not on the item count" >&2
            exit 1
          fi

      # `claims` skips every read it cannot take, so the failure to guard
      # against is a run that reached no remote and reported nothing. An id no
      # allocator ever minted is what proves the read happened.
      - name: An id holding no claim must fail the gate
        run: |
          python3 scripts/vendor/claude-skills/queue.py rank --tail > mutant.rank
          {
            echo "---"
            echo "id: Q999999"
            echo "rank: $(cat mutant.rank)"
            echo "labels:"
            echo "    - tests"
            echo "status: ready"
            echo "size: S"
            echo "---"
            echo
            echo "# A row filing an id that no allocator minted"
            echo
            echo "The mutation control for queue.py claims."
          } > docs/queue/Q999999.md
          python3 scripts/vendor/claude-skills/queue.py claims --strict > mutant.log 2>&1 && rc=0 || rc=$?
          echo "claims exit: $rc"
          cat mutant.log
          rm -f docs/queue/Q999999.md mutant.rank
          if [ "$rc" -eq 0 ]; then
            echo "::error::claims passed with an id holding no reservation" >&2
            exit 1
          fi
          if ! grep -q 'Q999999.md files an id holding no' mutant.log; then
            echo "::error::claims failed, but not on the unclaimed id" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: gofmt, go vet, go test
        run: make test

  # Two measured fail-opens, one job. `gofmt -l` lists every unformatted file
  # and exits 0. `go test ./...` exits 0 for a package with no test files, so
  # deleting the suite reads exactly like passing it -- which is what the second
  # mutation catches, since it demands red from a tree that has nothing to say.
  test-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: An unformatted file must fail the gate
        run: |
          printf 'package main\n\nfunc  unformatted()  {}\n' > cmd/spill-guard/mutant.go
          make test > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          rm -f cmd/spill-guard/mutant.go
          if [ "$rc" -eq 0 ]; then
            echo "::error::the Go gates passed with an unformatted file in the tree" >&2
            exit 1
          fi
          if ! grep -q 'failed: gofmt' mutant.log; then
            echo "::error::the gate failed, but not on gofmt" >&2
            exit 1
          fi
      - name: Making the binary exit zero on a bad command must fail the gate
        run: |
          sed -i 's/return 2$/return 0/' cmd/spill-guard/main.go
          if git diff --quiet; then
            echo "::error::the mutation changed nothing -- it no longer matches main.go" >&2
            exit 1
          fi
          make test > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- cmd/spill-guard/main.go
          if [ "$rc" -eq 0 ]; then
            echo "::error::the Go gates passed with spill-guard failing open" >&2
            exit 1
          fi
          if ! grep -q 'failed: go test' mutant.log; then
            echo "::error::the gate failed, but not on go test" >&2
            exit 1
          fi

  precision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: The shipped ruleset over the precision corpus
        run: make precision

  # The design calls this the job that matters most, and a false-positive count
  # pinned at zero is the easiest thing in this repository to pass while testing
  # nothing: an empty corpus, a retired test, a rule that matches nothing, and a
  # clean half nobody kept adversarial all report the same zero.
  #
  # Four mutations, one per way of reaching it. Each asserts its own effect
  # before running the gate, because a mutation that silently did not land
  # leaves a green run that reads exactly like a control that worked.
  precision-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The mutation is a byte-for-byte transplant of a fixture this same gate
      # proves is flagged, so the precondition is a comparison against a case
      # already measured rather than an assertion that a command ran.
      - name: A secret among the clean files must fail the gate
        run: |
          cp testdata/corpus/planted/aws-access-key-id.env testdata/corpus/clean/mutant.env
          if ! cmp -s testdata/corpus/planted/aws-access-key-id.env testdata/corpus/clean/mutant.env; then
            echo "::error::the transplant is not byte-identical to the fixture, so it is not the measured case" >&2
            exit 1
          fi
          make precision > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          rm -f testdata/corpus/clean/mutant.env
          if [ "$rc" -eq 0 ]; then
            echo "::error::precision passed with a planted AWS key among the clean files" >&2
            exit 1
          fi
          if ! grep -q 'clean corpus produced 1 finding(s), pinned at 0' mutant.log; then
            echo "::error::precision failed, but not on the false-positive count" >&2
            exit 1
          fi
      - name: Turning a shipped rule off must fail the gate
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("rules/spill-guard.json")
          t = p.read_text()
          at = t.index('"id": "aws-access-key-id"')
          at = t.index('"enabled": true', at)
          p.write_text(t[:at] + '"enabled": false' + t[at + len('"enabled": true'):])
          off = [r for r in json.loads(p.read_text())["rules"] if r["id"] == "aws-access-key-id"]
          assert off and off[0]["enabled"] is False, "aws-access-key-id is still enabled"
          PY
          if git diff --quiet rules/spill-guard.json; then
            echo "::error::the mutation changed nothing -- it no longer matches the ruleset" >&2
            exit 1
          fi
          make precision > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- rules/spill-guard.json
          if [ "$rc" -eq 0 ]; then
            echo "::error::precision passed with a shipped rule turned off" >&2
            exit 1
          fi
          if ! grep -q 'want exactly one aws-access-key-id finding, got 0' mutant.log; then
            echo "::error::precision failed, but not on the planted secret going unfound" >&2
            exit 1
          fi
      # A clean half that has drifted bland reports zero for the wrong reason,
      # and nothing about that zero looks different. Replacing every digit is
      # the cheapest way to take the NodePorts, the buffer constants and the
      # amdgpu string out at once.
      - name: A clean corpus with nothing adversarial left in it must fail the gate
        run: |
          python3 - <<'PY'
          import pathlib, re
          for f in pathlib.Path("testdata/corpus/clean").iterdir():
              f.write_text(re.sub(r"\d", "x", f.read_text()))
          PY
          if git diff --quiet testdata/corpus/clean; then
            echo "::error::the mutation changed nothing -- the clean corpus carried no digits" >&2
            exit 1
          fi
          make precision > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- testdata/corpus/clean
          if [ "$rc" -eq 0 ]; then
            echo "::error::precision passed over a clean corpus the inherited rules no longer fire on" >&2
            exit 1
          fi
          if ! grep -q 'the material the corpus exists to hold has drifted out of it' mutant.log; then
            echo "::error::precision failed, but not on the corpus losing its material" >&2
            exit 1
          fi
      # `go test -run` exits 0 when its pattern matches nothing, so a corpus test
      # that is renamed or moved retires itself and the gate keeps reporting the
      # remaining ones as a pass. This is the control on the gate script rather
      # than on the ruleset.
      - name: A retired corpus test must fail the gate
        run: |
          sed -i 's/func TestEveryEnabledRuleHasAPlantedFile(/func TestEveryEnabledRuleStillHasAPlantedFile(/' internal/scan/corpus_test.go
          if git diff --quiet internal/scan/corpus_test.go; then
            echo "::error::the mutation changed nothing -- the test name no longer matches" >&2
            exit 1
          fi
          make precision > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- internal/scan/corpus_test.go
          if [ "$rc" -eq 0 ]; then
            echo "::error::precision passed with one of its corpus tests renamed away" >&2
            exit 1
          fi
          if ! grep -q 'TestEveryEnabledRuleHasAPlantedFile reported no result' mutant.log; then
            echo "::error::precision failed, but not on the retired test" >&2
            exit 1
          fi

  no-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: The build graph is stdlib and this module only
        run: make no-deps

  # The dependency is local and wired in with a `replace`, so the control needs
  # no network and cannot be broken by an upstream module going away. It trips
  # both halves of the gate at once, and both are asserted separately below --
  # a run that only reports the `require` line has not exercised the graph walk.
  no-deps-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Take a dependency
        run: |
          mkdir -p mutant-dep
          printf 'module example.com/mutant\n\ngo 1.26.5\n' > mutant-dep/go.mod
          printf 'package mutant\n\nfunc Name() string { return "mutant" }\n' > mutant-dep/mutant.go
          printf 'package main\n\nimport _ "example.com/mutant"\n' > cmd/spill-guard/mutant.go
          go mod edit -require=example.com/mutant@v0.0.0 -replace=example.com/mutant=./mutant-dep
      - name: The no-deps check must fail, on both halves
        run: |
          make no-deps > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::no-deps passed with a third-party module required and imported" >&2
            exit 1
          fi
          if ! grep -q 'go.mod requires example.com/mutant' mutant.log; then
            echo "::error::no-deps did not report the require block" >&2
            exit 1
          fi
          if ! grep -q 'non-stdlib package in the build graph' mutant.log; then
            echo "::error::no-deps did not report the import graph" >&2
            exit 1
          fi

  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: The build graph reaches no net, net/http or os/exec
        run: make no-network

  # One mutation per forbidden package, because a check that happens to catch
  # net/http says nothing about os/exec -- which is the one that gets added in
  # good faith, to shell out to something helpful.
  no-network-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Each forbidden import must fail the check
        run: |
          for pkg in net net/http os/exec; do
            printf 'package main\n\nimport _ "%s"\n' "$pkg" > cmd/spill-guard/mutant.go
            make no-network > mutant.log 2>&1 && rc=0 || rc=$?
            echo "--- import $pkg -- check exit: $rc"
            cat mutant.log
            rm -f cmd/spill-guard/mutant.go
            if [ "$rc" -eq 0 ]; then
              echo "::error::no-network passed with $pkg imported" >&2
              exit 1
            fi
            if ! grep -q "^no-network: $pkg in the build graph" mutant.log; then
              echo "::error::no-network failed, but did not name $pkg" >&2
              exit 1
            fi
          done

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: All five targets build
        run: make cross-compile

  # The mutation breaks darwin, which is first in the list, and leaves windows
  # -- the last -- building. A loop that takes its status from the last target
  # reports green here, which is the whole reason this job exists.
  cross-compile-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Break a target that is not the last one
        run: printf 'package main\n\nfunc mutant() { var x int = "not an int"; _ = x }\n' > cmd/spill-guard/mutant_darwin.go
      - name: The cross-compile check must fail
        run: |
          make cross-compile > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::cross-compile passed with darwin broken" >&2
            exit 1
          fi
          if ! grep -q 'darwin/arm64 failed to build' mutant.log; then
            echo "::error::cross-compile failed, but not on darwin/arm64" >&2
            exit 1
          fi
          if ! grep -q 'windows/amd64: ok' mutant.log; then
            echo "::error::windows/amd64 did not build, so this run does not show the last target passing" >&2
            exit 1
          fi

  # The pin gate reads every workflow through the YAML parser in
  # tools/cmd/workflow, so it needs Go as well as Python.
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Every `uses:` names an immutable revision
        run: make action-pins

  # Two mutations, and they pull in opposite directions on purpose. The first
  # is the ordinary one: unpin a ref and require red. The second is the reason
  # this gate parses YAML instead of matching lines, and it requires *green* --
  # a `uses:` inside a comment or a `run:` block is not a mapping key, and a
  # gate that flagged it would be unusable in this very repository, whose own
  # workflow contains both.
  action-pins-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: A ref pinned to a tag must fail the gate
        run: |
          sed -i 's|actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1|actions/checkout@v7|' \
            .github/workflows/tests.yml
          if git diff --quiet; then
            echo "::error::the mutation changed nothing -- the checkout pin no longer matches" >&2
            exit 1
          fi
          make action-pins > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- .github/workflows/tests.yml
          if [ "$rc" -eq 0 ]; then
            echo "::error::action-pins passed with a tag-pinned action" >&2
            exit 1
          fi
          if ! grep -q "is pinned to 'v7'" mutant.log; then
            echo "::error::action-pins failed, but not on the tag" >&2
            exit 1
          fi

      # The inverted one. `-eq 0` below is deliberate and is not a typo: this
      # feeds the gate input that must NOT trip it, so green is the pass.
      - name: A `uses:` that is not a mapping key must NOT fail the gate
        run: |
          make action-pins > base.log 2>&1
          base=$(sed -n 's/^action-pins: \([0-9][0-9]*\) .*/\1/p' base.log)
          # The file count is read rather than written down, for the reason the
          # reference count already was: this step adds one workflow to
          # whatever the tree holds, and a literal is a second copy of a number
          # the repository is free to change. It was `2`, and the release
          # pipeline made it wrong -- the gate reported `across 3 workflow(s)`,
          # correctly, and the control failed on its own arithmetic.
          basefiles=$(sed -n 's/^action-pins: [0-9][0-9]* .*across \([0-9][0-9]*\) workflow(s).*/\1/p' base.log)
          if [ -z "$base" ] || [ -z "$basefiles" ]; then
            echo "::error::could not read the baseline counts from action-pins" >&2
            exit 1
          fi
          cat > .github/workflows/mutant.yml <<'MUTANT'
          # uses: actions/evil@v1
          on: push
          jobs:
            a:
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                - run: |
                    # uses: actions/evil@v1
                    echo "uses: actions/evil@v1"
          MUTANT
          make action-pins > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          rm -f .github/workflows/mutant.yml
          if [ "$rc" -ne 0 ]; then
            echo '::error::action-pins flagged a uses: that is not a mapping key' >&2
            exit 1
          fi
          if ! grep -q "across $((basefiles + 1)) workflow(s)" mutant.log; then
            echo "::error::action-pins did not read the second workflow at all" >&2
            exit 1
          fi
          if ! grep -q "^action-pins: $((base + 1)) " mutant.log; then
            echo "::error::action-pins did not count the one added reference" >&2
            exit 1
          fi

      # The floor. Everything above assumes the extractor found something; this
      # is what happens when it does not. `make vendor`-style digest checks and
      # `gates.py` both refuse an empty input set for the same reason -- a sweep
      # of nothing prints the same success line as a sweep of everything.
      - name: An extractor that finds no `uses:` at all must fail the gate
        run: |
          sed -i 's|if k.Value == "uses" {|if false {|' tools/cmd/workflow/main.go
          if git diff --quiet -- tools/cmd/workflow/main.go; then
            echo "::error::the mutation changed nothing -- the walk no longer matches" >&2
            exit 1
          fi
          make action-pins > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- tools/cmd/workflow/main.go
          if [ "$rc" -eq 0 ]; then
            echo "::error::action-pins passed having checked no reference at all" >&2
            exit 1
          fi
          if ! grep -q 'not one `uses:` among them' mutant.log; then
            echo "::error::action-pins failed, but not on the empty sweep" >&2
            exit 1
          fi

  # The one gate whose oracle is off the runner: govulncheck reads the advisory
  # database at vuln.go.dev.
  vulns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: No known vulnerability the build graph calls
        run: make vulns

  # Two mutations, for the two ways this gate can end badly, because the whole
  # design of check-vulns.py is telling them apart. The second one takes a real
  # dependency with a real advisory, which is the only way to reach the finding
  # branch -- and it is the one control here a third party can break. That is
  # acceptable for this gate and no other: its oracle is already the network.
  vulns-mutation-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: A database it cannot read must fail as a tool failure, not a CVE
        run: |
          sed -i 's|"-C", str(ROOT), "./..."|"-db", "https://127.0.0.1:1/nope", "-C", str(ROOT), "./..."|' \
            scripts/check-vulns.py
          if git diff --quiet; then
            echo "::error::the mutation changed nothing -- check-vulns.py no longer matches" >&2
            exit 1
          fi
          make vulns > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- scripts/check-vulns.py
          if [ "$rc" -eq 0 ]; then
            echo "::error::vulns passed with an unreadable advisory database" >&2
            exit 1
          fi
          if ! grep -q 'this is the tool failing, not an answer about the code' mutant.log; then
            echo "::error::vulns failed, but reported it as a finding about the code" >&2
            exit 1
          fi

      - name: A dependency with a called advisory must fail the gate
        run: |
          go get golang.org/x/text@v0.3.0
          mkdir -p internal/mutant
          cat > internal/mutant/mutant.go <<'MUTANT'
          package mutant

          import "golang.org/x/text/language"

          // Parse carries GO-2021-0113, which govulncheck reports only when the
          // vulnerable symbol is actually reachable.
          func Tag(s string) string {
            t, err := language.Parse(s)
            if err != nil {
              return ""
            }
            return t.String()
          }
          MUTANT
          go mod tidy
          if git diff --quiet go.mod; then
            echo "::error::the mutation changed nothing -- go.mod took no dependency" >&2
            exit 1
          fi
          make vulns > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          rm -rf internal/mutant
          git checkout -- go.mod
          rm -f go.sum
          if [ "$rc" -eq 0 ]; then
            echo "::error::vulns passed with a called advisory in the graph" >&2
            exit 1
          fi
          if ! grep -q 'found a vulnerability this code calls' mutant.log; then
            echo "::error::vulns failed, but not on the advisory" >&2
            exit 1
          fi
