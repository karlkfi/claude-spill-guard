name: release

# A tag publishes; a pull request rehearses.
#
# The release job runs on `v*` and on nothing else, so no pull request
# exercises it and its first execution would be a permanent version number --
# the one thing in this repository that cannot be fixed forward by pushing
# again. `dry-run` is the answer: it builds the same archives from the same
# config on every pull request, so the half that can be exercised without a tag
# is exercised on every change. What it cannot reach is stated where it stops,
# not implied by a green tick.
#
# This file is not in GATES. `make check` runs the gates, and a release
# pipeline is not one: a contributor cannot build a release locally without the
# two tools scripts/check-tools.sh reports in its `release` tier, and a gate
# that needs a tool `make doctor` calls optional is a gate that fails on a
# fresh clone. See docs/development/release-process.md.
#
# One consequence worth naming rather than discovering: `gate-drift` reads
# tests.yml alone (scripts/gates.py pins it), so nothing checks this file's job
# list against anything. A job deleted from here goes unnoticed by the check
# that exists to catch exactly that, and Q59 covers the mutation-control half
# rather than this one.
on:
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  # Everything a release does except signing, publishing, and the tag.
  # Unfiltered by path on purpose: the assertion is against the target list in
  # scripts/cross-compile.py, so a change there has to re-run this, and a
  # path-gated job that was skipped reports no check at all -- which reads
  # exactly like one that passed.
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history: GoReleaser warns on a shallow clone, and mod_timestamp
      # reads the commit's own timestamp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Not `goreleaser/goreleaser-action`. That action is pinned by SHA, as
      # `action-pins` requires of every `uses:`, and the CLI it downloaded was
      # chosen by a version input -- a git tag on goreleaser/goreleaser,
      # resolved on the day, on the job that holds this repository's token. A
      # tool version passed as an action input is not a `uses:` value, so no
      # gate can read it. scripts/install-goreleaser.py carries the argument
      # and the digests, and refuses before anything is extracted or run.
      - name: The pinned GoReleaser, verified against the digest committed here
        run: python3 scripts/install-goreleaser.py

      # Against the schema of the pinned binary, so a config that drifted ahead
      # of the version that reads it fails here rather than on a tag.
      - name: The config validates against the pinned GoReleaser
        run: goreleaser check

      # --snapshot implies --skip=announce,publish,validate. Signing is skipped
      # separately: cosign sign-blob writes a public Rekor entry, and minting
      # one per pull request logs builds nobody published.
      - name: A snapshot builds every archive
        run: goreleaser release --snapshot --clean --skip=sign

      - name: One archive per shipped target, named as the channels expect
        run: python3 scripts/check-release-artifacts.py

      # The install jobs install these exact bytes rather than each building
      # their own, so all three operating systems install one set of archives
      # against the one checksums.txt the step above just read. `error` on no
      # files found, because an empty upload would reach those jobs as a dist
      # directory with nothing in it -- which reads like a build that produced
      # nothing rather than an upload that matched nothing.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/metadata.json
          if-no-files-found: error
          retention-days: 1

  # Three mutations. Two are the halves of check-release-artifacts.py that fail
  # in opposite directions; the third is the GoReleaser pin, which no gate can
  # read. Each asserts the mutation landed before asking for red: a break that
  # silently did not happen leaves the checker reading clean input, and a
  # control that passes for that reason is indistinguishable from one that
  # worked.
  dry-run-mutation-control:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history: GoReleaser warns on a shallow clone, and mod_timestamp
      # reads the commit's own timestamp.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # A pin is only a pin if a job fails when the bytes move, and nothing
      # else here can assert that: `action-pins` reads `uses:` values, and the
      # GoReleaser version is not one. The substitution is over any 64-character
      # digest rather than a literal copied from the script, so re-pinning does
      # not silently retire this control. The install step below is the other
      # half -- it runs the unmutated script and every step after it needs the
      # binary, so a refusal that fired on every archive would redden here too.
      - name: An archive that does not match the pinned digest must not be installed
        run: |
          python3 - <<'MUTANT'
          import pathlib
          import re
          import sys
          p = pathlib.Path("scripts/install-goreleaser.py")
          t = p.read_text(encoding="utf-8")
          mutated, n = re.subn(r"\b[0-9a-f]{64}\b", "0" * 64, t)
          if not n:
              sys.exit(f"{p} carries no 64-character digest, so this control "
                       f"has nothing to break and the assertion below would be "
                       f"about an unmutated script")
          p.write_text(mutated, encoding="utf-8")
          print(f"replaced {n} pinned digest(s) with zeroes")
          MUTANT
          if git diff --quiet scripts/install-goreleaser.py; then
            echo "::error::the mutation left scripts/install-goreleaser.py byte-identical, so the install below read the real digest" >&2
            exit 1
          fi
          python3 scripts/install-goreleaser.py > mutant.log 2>&1 && rc=0 || rc=$?
          echo "install exit: $rc"
          cat mutant.log
          git checkout -- scripts/install-goreleaser.py
          if [ "$rc" -eq 0 ]; then
            echo "::error::the install accepted an archive that does not match the pinned digest" >&2
            exit 1
          fi
          if ! grep -q 'does not match the digest this repository pinned' mutant.log; then
            echo "::error::the install refused, and not on the digest" >&2
            exit 1
          fi

      - name: The pinned GoReleaser, verified against the digest committed here
        run: python3 scripts/install-goreleaser.py

      # The failure this check exists for: the release config ships fewer
      # platforms than the cross-compile gate builds. Nothing else notices --
      # every archive that was built is correct, and the missing one is missing
      # from a list nobody re-reads.
      - name: A target dropped from the release config must fail the check
        run: |
          python3 - <<'MUTANT'
          import pathlib
          p = pathlib.Path(".goreleaser.yaml")
          t = p.read_text(encoding="utf-8")
          old = "    ignore:\n      - goos: windows\n        goarch: arm64\n"
          new = old + "      - goos: linux\n        goarch: arm64\n"
          p.write_text(t.replace(old, new), encoding="utf-8")
          MUTANT
          if git diff --quiet .goreleaser.yaml; then
            echo "::error::the mutation changed nothing -- .goreleaser.yaml no longer matches" >&2
            exit 1
          fi
          goreleaser release --snapshot --clean --skip=sign
          python3 scripts/check-release-artifacts.py > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- .goreleaser.yaml
          if [ "$rc" -eq 0 ]; then
            echo "::error::the check passed with linux/arm64 dropped from the release" >&2
            exit 1
          fi
          if ! grep -q 'nothing was archived for linux/arm64' mutant.log; then
            echo "::error::the check failed, but not on the missing target" >&2
            exit 1
          fi

      # checksums.txt is what every install channel verifies against and what
      # cosign signs, so a run that wrote a stale one signs a wrong answer and
      # the signature over it verifies perfectly.
      - name: An archive that does not match checksums.txt must fail the check
        run: |
          goreleaser release --snapshot --clean --skip=sign
          python3 - <<'MUTANT'
          import hashlib, pathlib, sys
          a = next(pathlib.Path("dist").glob("*linux_amd64.tar.gz"))
          before = hashlib.sha256(a.read_bytes()).hexdigest()
          a.write_bytes(a.read_bytes() + b"x")
          if hashlib.sha256(a.read_bytes()).hexdigest() == before:
              sys.exit("the mutation changed nothing -- the archive still hashes the same")
          print(f"{a.name} no longer matches its recorded digest")
          MUTANT
          python3 scripts/check-release-artifacts.py > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::the check passed with an archive that does not match checksums.txt" >&2
            exit 1
          fi
          if ! grep -q 'Signing that file signs a wrong answer' mutant.log; then
            echo "::error::the check failed, but not on the digest mismatch" >&2
            exit 1
          fi

  # The install scripts, driven on the three operating systems they are aimed
  # at. Nothing else in this repository runs them, and both reasons are
  # structural. `make check` cannot: they install out of a dist directory only
  # GoReleaser produces, and scripts/check-tools.sh puts goreleaser in the tier
  # a contributor fixing a bug has no reason to install -- which is the same
  # reason this whole file is not in GATES. And the release job would first
  # execute them on a permanent version number.
  #
  # An install script that broke is indistinguishable from a tool nobody
  # installed: the people who would report it are the people who could not
  # install it.
  #
  # macOS and Linux take install.sh, Windows takes install.ps1, and
  # check-install-scripts.py decides which rather than the matrix. The pair
  # covers three operating systems and neither script covers all three --
  # install.ps1 on Linux would be building %LOCALAPPDATA% paths that do not
  # exist there.
  #
  # fail-fast is off. Three platforms is the whole point, and a first failure
  # that cancels the other two turns a three-platform report into a
  # one-platform one on exactly the runs where the report matters.
  install-dry-run:
    if: github.event_name == 'pull_request'
    needs: dry-run
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # bash on Windows too, so one command covers the matrix. Which name
      # setup-python leaves on PATH is asked rather than assumed: `python3` is
      # what the rest of this repository invokes and `python` is what a Windows
      # image is likelier to carry, and a wrong guess here is a `command not
      # found` on one leg of a three-platform report.
      - name: The install script installs, runs, and refuses
        shell: bash
        run: |
          py=python3
          if ! command -v "$py" > /dev/null 2>&1; then
            py=python
          fi
          if ! command -v "$py" > /dev/null 2>&1; then
            echo "::error::setup-python left neither python3 nor python on PATH, so nothing below ran" >&2
            exit 1
          fi
          "$py" scripts/check-install-scripts.py

  # The row's own words: break the checksum comparison and require the job to
  # go red. The mutation is on the install script rather than on an archive --
  # check-install-scripts.py already corrupts an archive as one of its arms, so
  # corrupting one here would exercise that arm instead of controlling it.
  #
  # Two legs, one per script: the comparison is written twice in two languages,
  # and a control over one says nothing about the other. macOS is not here
  # because it runs the same install.sh Linux does, and the happy path above is
  # where its leg earns its keep.
  install-dry-run-mutation-control:
    if: github.event_name == 'pull_request'
    needs: dry-run
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: install/install.sh
          - os: windows-latest
            script: install/install.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: An install script that stopped comparing the digest must fail the check
        shell: bash
        env:
          MUTANT_SCRIPT: ${{ matrix.script }}
        run: |
          py=python3
          if ! command -v "$py" > /dev/null 2>&1; then
            py=python
          fi
          if ! command -v "$py" > /dev/null 2>&1; then
            echo "::error::setup-python left neither python3 nor python on PATH, so nothing below ran" >&2
            exit 1
          fi
          "$py" - <<'MUTANT'
          import os
          import pathlib
          import sys

          # Each spelling compares the digest to itself, so the comparison is
          # always true and the refusal under it never runs. One token each:
          # a mutation that broke the syntax would fail the check for a reason
          # that says nothing about the digest, and the grep at the end is what
          # separates those two outcomes.
          MUTATIONS = {
              "install/install.sh": ('[ "$actual" = "$expected" ] ||',
                                     '[ "$actual" = "$actual" ] ||'),
              "install/install.ps1": ("if ($actual -ne $expected) {",
                                      "if ($actual -ne $actual) {"),
          }
          name = os.environ["MUTANT_SCRIPT"]
          old, new = MUTATIONS[name]
          path = pathlib.Path(name)
          # newline="" both ways: a text write on Windows would translate every
          # line ending in the file, which is a second mutation nobody asked
          # for and one .gitattributes pins LF against.
          with open(path, "r", encoding="utf-8", newline="") as fh:
              text = fh.read()
          if old not in text:
              sys.exit(f"{name} no longer carries {old!r}, so this control has "
                       f"nothing to break and the assertion below would be "
                       f"about an unmutated script")
          with open(path, "w", encoding="utf-8", newline="") as fh:
              fh.write(text.replace(old, new))
          MUTANT
          if git diff --quiet "$MUTANT_SCRIPT"; then
            echo "::error::the mutation left $MUTANT_SCRIPT byte-identical, so the check below read the real script" >&2
            exit 1
          fi
          "$py" scripts/check-install-scripts.py > mutant.log 2>&1 && rc=0 || rc=$?
          echo "check exit: $rc"
          cat mutant.log
          git checkout -- "$MUTANT_SCRIPT"
          if [ "$rc" -eq 0 ]; then
            echo "::error::the check passed against an install script that no longer compares the archive against checksums.txt" >&2
            exit 1
          fi
          # The check's own corrupted-archive arm asserts that appending a
          # byte moved the digest, and reports `changed nothing` when it did
          # not. That report also names a corrupted archive, so it would
          # satisfy the grep below while proving nothing -- read it first.
          if grep -q 'changed nothing' mutant.log; then
            echo "::error::the check could not corrupt an archive, so it never reached the comparison this control removed" >&2
            exit 1
          fi
          # The phrase is loose because the mutation lands on two different
          # arms and which one depends on the gzip, so a leg-specific string
          # would redden somewhere. Both measured against this exact mutation:
          #
          #   darwin/arm64 -- BSD gzip ignores the appended byte, tar extracts,
          #     and the finding is `accepted a corrupted archive`.
          #   ubuntu-latest -- GNU gzip rejects it (`gzip: stdin: unexpected end
          #     of file`), so the script stops at the extract and the finding is
          #     `refused a corrupted archive and not for that reason`.
          #
          # Read from job 99688412664 on 7195bca for the ubuntu arm, and
          # reproduced locally for the darwin one. Both are the comparison being
          # gone, which is what this control asserts; nothing else this check
          # reports names a corrupted archive.
          if ! grep -q 'a corrupted archive' mutant.log; then
            echo "::error::the check failed, and not on the corrupted archive" >&2
            exit 1
          fi

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload the assets.
      contents: write
      # The keyless identity cosign signs with, and the one the provenance
      # attestation is minted against. There is no key to store, rotate, or
      # lose, and no secret in this workflow at all.
      id-token: write
      # actions/attest-build-provenance writes to the attestations API, which
      # is what `gh attestation verify` reads.
      attestations: write
    steps:
      # Full history and tags: GoReleaser reads the tag it is building from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned GoReleaser, verified against the digest committed here
        run: python3 scripts/install-goreleaser.py

      # docs/releases/README.md states that the file there matches the
      # published body. Nothing enforced it, and the direction that goes wrong
      # is the release publishing a generated changelog nobody wrote -- which
      # then has to be corrected on the Release, off the record the invariant
      # exists to keep. This is the enforcement: no notes file, no release.
      - name: The notes for this tag are in the tree
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is not in this tree, so there is no body to publish. Nothing was published under this tag, so delete it, write the notes, merge them, and tag again from the commit that carries them. The release body is authored in the repository, not typed into the web form." >&2
            exit 1
          fi
          printf 'publishing %s (%s bytes)\n' "$notes" "$(wc -c < "$notes")"

      - name: Build, sign, and upload to a draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --release-notes "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Which workflow, commit, and runner built each archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: One archive per shipped target, each signed
        run: python3 scripts/check-release-artifacts.py --signed

      # Everything above asserts what this run built. This asserts what the
      # release actually carries, which is a different question: an upload can
      # drop an asset, and the check that reads dist/ cannot see it.
      #
      # The identity is pinned to this workflow at this tag. A signature minted
      # from a branch, from another workflow, or from a fork verifies as a
      # valid Sigstore signature and must not verify as this release's.
      - name: The published assets verify as an outside consumer would check them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir published
          for f in checksums.txt checksums.txt.sig checksums.txt.pem; do
            if ! cmp -s "dist/$f" "published/$f"; then
              echo "::error::the published $f is not the one this run built" >&2
              exit 1
            fi
          done
          cosign verify-blob \
            --certificate published/checksums.txt.pem \
            --signature published/checksums.txt.sig \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            published/checksums.txt
          # How many archives a release publishes, read from the same import
          # check-release-artifacts.py uses rather than written down here. A
          # literal is the defect this PR removed from
          # action-pins-mutation-control, and it would be worse in this block:
          # it is only reachable on a tag push, after the upload.
          expected=$(python3 scripts/check-release-artifacts.py --count-targets)
          if [ -z "$expected" ] || [ "$expected" -lt 1 ]; then
            echo "::error::could not read the shipped-target count; refusing to verify against an unknown number" >&2
            exit 1
          fi
          cd published
          sha256sum -c checksums.txt
          # nullglob, so a pattern that matched nothing expands to nothing
          # rather than to itself. Without it the count below reaches 5 over a
          # release missing every zip, because the literal `*.zip` is counted
          # as an archive -- measured against this block on 2026-08-25.
          shopt -s nullglob
          verified=0
          for f in *.tar.gz *.zip; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            verified=$((verified + 1))
          done
          if [ "$verified" -ne "$expected" ]; then
            echo "::error::verified provenance for $verified archives, and a release publishes $expected" >&2
            exit 1
          fi

      - name: What a maintainer does next
        run: |
          printf 'The release is a DRAFT. Nothing reaches a user until someone publishes it.\n\n'
          printf '  gh release view %s\n' "$GITHUB_REF_NAME"
          printf '  gh release edit %s --draft=false\n\n' "$GITHUB_REF_NAME"
          printf 'docs/development/release-process.md carries the sign-off list.\n'
