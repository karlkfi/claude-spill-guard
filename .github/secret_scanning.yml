# The precision corpus is fixtures, and every one of them is shaped like the
# thing it tests. `testdata/corpus/planted/` holds one fabricated credential
# per shipped rule -- that is what proves the rule can fire -- and
# `testdata/corpus/clean/` holds the placeholder credentials a real repository
# is full of, which is what proves the rules stay quiet on them.
#
# GitHub push protection reads them as what they imitate and rejects the push.
# Measured 2026-08-26 on the Q7 branch: six detections, five in `planted/` and
# one on the placeholder Slack webhook in `clean/env.example`.
#
# Tuning the fixtures out of GitHub's detectors was measured and does not work.
# Only the Slack bot token escaped, on a segment shorter than GitHub's minimum;
# Stripe and OpenAI each went from one detection to two, and the only lever
# left on Stripe is a key body below 24 characters, which this project's own
# rule also requires. Escaping it means loosening the ruleset to dodge a
# scanner.
#
# So the exclusion is the narrow answer: two directories that exist to hold
# imitation credentials. It is not a blanket exemption, and it does mean a
# real secret committed under `testdata/corpus/` would go unreported -- which
# is the cost, stated rather than buried.
#
# The third entry is a file, and it is here because the same lever fails
# again. `internal/validate/aws_test.go` holds the survivors that prove the
# placeholder check drops something rather than everything, and two of them
# carry the ASIA prefix because that prefix is what the case tests. GitHub's
# detector for it applies no placeholder filter at all: alert 1, on
# 2026-08-25, was `ASIAIOSFODNN7EXAMPLE` -- AWS's own published value,
# resolved by hand as a false positive -- and alert 10, on 2026-08-27, was the
# second ASIA literal in the same file. Marking the body the way
# `testdata/corpus/README.md` marks a planted fixture escapes neither, since a
# detector that fires on EXAMPLE fires on anything. The AKIA fixtures in the
# other packages have never alerted, so nothing else under `internal/` is
# listed here, and a real secret pasted into this one test file would go
# unreported.
paths-ignore:
  - "testdata/corpus/**"
  - "internal/validate/aws_test.go"
