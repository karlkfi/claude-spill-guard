# The precision corpus is fixtures, and every one of them is shaped like the
# thing it tests. `testdata/corpus/planted/` holds one fabricated credential
# per shipped rule -- that is what proves the rule can fire -- and
# `testdata/corpus/clean/` holds the placeholder credentials a real repository
# is full of, which is what proves the rules stay quiet on them.
#
# GitHub push protection reads them as what they imitate and rejects the push.
# Measured 2026-08-26 on the Q7 branch: six detections, five in `planted/` and
# one on the placeholder Slack webhook in `clean/env.example`.
#
# Tuning the fixtures out of GitHub's detectors was measured and does not work.
# Only the Slack bot token escaped, on a segment shorter than GitHub's minimum;
# Stripe and OpenAI each went from one detection to two, and the only lever
# left on Stripe is a key body below 24 characters, which this project's own
# rule also requires. Escaping it means loosening the ruleset to dodge a
# scanner.
#
# So the exclusion is the narrow answer: two directories that exist to hold
# imitation credentials, and nothing else. It is not a blanket exemption, and
# it does mean a real secret committed under `testdata/corpus/` would go
# unreported -- which is the cost, stated rather than buried.
#
# A source file was listed here for one day. `internal/validate/aws_test.go`
# held the ASIA literal GitHub alerted on, and the entry was the narrow answer
# until a better one existed. Q80 built it: the values a test asserts on live
# in `testdata/corpus/vectors/`, which this file already covers, so no source
# file needs an exemption of its own.
#
# The entry never closed the alert it was added for. Alerts 2 through 9 were
# created and resolved in the same second, their exclusion having merged
# first; alert 10 predates its own by a day and was still open eleven minutes
# after the merge, its `updated_at` two seconds past it. One observation, so
# what is measured is those timings rather than a rule about how exclusions
# apply -- but nothing here waits on the difference, because a value that
# could pass for a credential is no longer in the file either way.
paths-ignore:
  - "testdata/corpus/**"
