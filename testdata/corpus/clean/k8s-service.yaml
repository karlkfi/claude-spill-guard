# Ingress fronting the two services that take outside traffic. NodePorts are
# pinned rather than allocated, because the firewall rules are managed
# elsewhere and a reallocation on rollout takes the cluster off the network.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: edge
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: NodePort
  clusterIP: 10.96.0.42
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 8443
      nodePort: 30443
    - name: metrics
      port: 9090
      targetPort: 9090
      nodePort: 30909
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-internal
  namespace: edge
spec:
  type: ClusterIP
  clusterIP: 10.96.13.7
  ports:
    - port: 8080
      targetPort: 8080
