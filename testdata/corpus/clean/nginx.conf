worker_processes  auto;
worker_rlimit_nofile 65536;

events {
    worker_connections  16384;
    multi_accept on;
}

http {
    client_max_body_size 64m;
    client_body_buffer_size 65536;
    large_client_header_buffers 4 16384;

    upstream gateway {
        server 10.0.4.11:8080 max_fails=3 fail_timeout=30s;
        server 10.0.4.12:8080 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8080 backup;
    }

    server {
        listen 30080;
        listen 30443 ssl;
        server_name gateway.internal;

        ssl_certificate     /etc/ssl/certs/gateway.pem;
        ssl_certificate_key /etc/ssl/private/gateway.key;

        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;

        location / {
            proxy_pass http://gateway;
            proxy_read_timeout 30000ms;
        }
    }
}
