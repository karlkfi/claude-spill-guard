<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7e57c2"/>
    </linearGradient>
    <g id="deny">
      <rect x="0" y="0" width="92" height="32" rx="16" fill="#2d1417" stroke="#da3633" stroke-width="1.5"/>
      <circle cx="19" cy="16" r="7" fill="none" stroke="#ff7b72" stroke-width="2.2"/>
      <line x1="14" y1="21" x2="24" y2="11" stroke="#ff7b72" stroke-width="2.2" stroke-linecap="round"/>
      <text x="34" y="21" font-size="16" font-weight="700" fill="#ff7b72">deny</text>
    </g>
    <g id="block">
      <rect x="0" y="0" width="92" height="32" rx="16" fill="#2d1417" stroke="#da3633" stroke-width="1.5"/>
      <circle cx="19" cy="16" r="7" fill="none" stroke="#ff7b72" stroke-width="2.2"/>
      <line x1="14" y1="21" x2="24" y2="11" stroke="#ff7b72" stroke-width="2.2" stroke-linecap="round"/>
      <text x="34" y="21" font-size="16" font-weight="700" fill="#ff7b72">block</text>
    </g>
    <g id="allow">
      <rect x="0" y="0" width="92" height="32" rx="16" fill="#12261a" stroke="#238636" stroke-width="1.5"/>
      <path d="M13 16 l5 5 l9 -11" fill="none" stroke="#56d364" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="21" font-size="16" font-weight="700" fill="#56d364">allow</text>
    </g>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="640" cy="380" rx="520" ry="300" fill="url(#glow)" opacity="0.25"/>

  <!-- ===== header ===== -->
  <!-- shield + droplet mark -->
  <g transform="translate(64,58)">
    <path d="M36 2 L70 14 V44 C70 66 54 80 36 88 C18 80 2 66 2 44 V14 Z"
          fill="url(#shieldMark)" stroke="#c4b5fd" stroke-width="1.6"/>
    <path d="M36 13 C36 13 17 35 17 50 A19 19 0 0 0 55 50 C55 35 36 13 36 13 Z" fill="#f1ecff"/>
  </g>

  <text x="156" y="98" font-size="58" font-weight="800" letter-spacing="-1">
    <tspan fill="#e6edf3">spill</tspan><tspan fill="#a78bfa">-guard</tspan>
  </text>
  <text x="158" y="138" font-size="25" font-weight="500" fill="#c9d1d9" letter-spacing="0.2">
    Stops Claude Code leaking your secrets to Anthropic
  </text>
  <text x="1216" y="138" text-anchor="end" font-size="18" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#a2aab4">github.com/karlkfi/claude-spill-guard</text>

  <!-- ===== terminal panel ===== -->
  <g>
    <rect x="64" y="176" width="1152" height="384" rx="18" fill="#0b0f16" stroke="#222b38" stroke-width="1.5"/>
    <path d="M64 194 a18 18 0 0 1 18 -18 H1198 a18 18 0 0 1 18 18 V220 H64 Z" fill="#11161f"/>
    <circle cx="92" cy="198" r="6" fill="#ff5f56"/>
    <circle cx="114" cy="198" r="6" fill="#ffbd2e"/>
    <circle cx="136" cy="198" r="6" fill="#27c93f"/>
    <text x="640" y="203" text-anchor="middle" font-size="16" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#a2aab4">UserPromptSubmit · PreToolUse</text>
  </g>

  <!-- surface tags -->
  <g font-size="14" font-weight="700" fill="#c4b5fd" letter-spacing="1.5" text-anchor="middle">
    <g transform="translate(100,256)"><rect width="84" height="28" rx="6" fill="#1b1530" stroke="#4c3a80"/><text x="42" y="19">PROMPT</text></g>
    <g transform="translate(100,316)"><rect width="84" height="28" rx="6" fill="#1b1530" stroke="#4c3a80"/><text x="42" y="19">READ</text></g>
    <g transform="translate(100,376)"><rect width="84" height="28" rx="6" fill="#1b1530" stroke="#4c3a80"/><text x="42" y="19">BASH</text></g>
    <g transform="translate(100,436)"><rect width="84" height="28" rx="6" fill="#1b1530" stroke="#4c3a80"/><text x="42" y="19">BASH</text></g>
    <g transform="translate(100,508)"><rect width="84" height="28" rx="6" fill="#1b1530" stroke="#4c3a80"/><text x="42" y="19">BASH</text></g>
  </g>

  <!-- calls -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="23" fill="#c9d1d9">
    <text x="208" y="278">check <tspan fill="#c4b5fd">@deploy.env</tspan> before I ship</text>
    <text x="208" y="338">~/.npmrc</text>
    <text x="208" y="398"><tspan fill="#7e57c2">$ </tspan>cat certs/server.key</text>
    <text x="208" y="458"><tspan fill="#7e57c2">$ </tspan>env</text>
    <text x="236" y="488" font-size="19" fill="#56d364">↳ env | cut -d= -f1</text>
    <text x="208" y="530"><tspan fill="#7e57c2">$ </tspan>cat go.mod</text>
  </g>

  <!-- verdicts -->
  <use href="#block" x="820" y="254"/>
  <use href="#deny" x="820" y="314"/>
  <use href="#deny" x="820" y="374"/>
  <use href="#deny" x="820" y="434"/>
  <use href="#allow" x="820" y="506"/>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#c9d1d9">
    <text x="932" y="276">aws-access-key-id</text>
    <text x="932" y="336">github-token</text>
    <text x="932" y="396">private-key-block</text>
    <text x="932" y="456">env dump</text>
  </g>

  <!-- footer -->
  <text x="640" y="608" text-anchor="middle" font-size="22" font-weight="500" fill="#c9d1d9">One static Go binary. <tspan fill="#c4b5fd" font-weight="700">No dependencies, no network</tspan>, and a block names the rule, <tspan fill="#ff7b72" font-weight="700">never the value</tspan>.</text>
</svg>
